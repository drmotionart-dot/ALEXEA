<title>Tools page · design source of truth</title>
<!--
  DESIGN SOURCE OF TRUTH for the tools page. Match layout, colors, drawings, labels and
  behavior exactly. Do not restyle. Drawings come from tool-drawings.js (same folder).
  The "View as" row exists only in this preview; the real app takes the role from the login.
  All data below is SAMPLE DATA. Behavior is described in docs/BEHAVIOR.md.
-->
<style>
:root{
  --page:#FAF9F5;--surface-1:#F1EFE8;--surface-2:#FFFFFF;
  --border:rgba(20,20,19,.15);--border-strong:rgba(20,20,19,.30);--border-stronger:rgba(20,20,19,.50);
  --text:#141413;--text-2:#5E5D59;
  --bg-accent:#DCE9F8;--text-accent:#1F5FA6;
  --bg-ok:#DDEFD0;--text-ok:#2F6B14;
  --bg-warn:#FBEBC4;--text-warn:#7A5600;
  --bg-bad:#F8D9D5;--text-bad:#9B2C20;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root{
  --page:#1F1E1D;--surface-1:#2B2A28;--surface-2:#262624;
  --border:rgba(250,249,245,.15);--border-strong:rgba(250,249,245,.30);--border-stronger:rgba(250,249,245,.50);
  --text:#FAF9F5;--text-2:#B8B6AD;
  --bg-accent:#1D3A5C;--text-accent:#A9CDF5;
  --bg-ok:#1E3F14;--text-ok:#B4E09A;
  --bg-warn:#4A3A12;--text-warn:#F0CE82;
  --bg-bad:#4D2420;--text-bad:#F5B5AC;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
button{background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,.cd:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
button.on{background:var(--surface-1);border-color:var(--border-stronger)}
input[type=text],input:not([type]){font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px}
svg.i{width:16px;height:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.row .lb{font-size:12px;color:var(--text-2);min-width:52px}
.sc{flex:1;min-width:150px}
.er{font-size:13px;color:var(--text-bad);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cd{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:8px 10px;cursor:pointer}
.cd:hover{border-color:var(--border-strong)}
.cd.sl{border-color:var(--text)}
.th{background:var(--surface-2);border-radius:8px;padding:2px 4px;overflow:hidden}
.th img,.big img{width:100%;height:90px;object-fit:cover;display:block;border-radius:6px}
.nmx{font-size:13px;font-weight:500;margin:6px 0 0}
.sr{font-size:11px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;margin:0 0 4px}
.lc{font-size:12px;color:var(--text-2);margin:4px 0 0}
.pl{font-size:11px;padding:1px 8px;border-radius:var(--radius);display:inline-block;margin-right:4px}
.s-a{background:var(--bg-ok);color:var(--text-ok)}
.s-u{background:var(--bg-accent);color:var(--text-accent)}
.s-m{background:var(--bg-warn);color:var(--text-warn)}
.s-r{background:var(--bg-bad);color:var(--text-bad)}
#dt{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none}
.dg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media(max-width:560px){.dg{grid-template-columns:minmax(0,1fr)}}
.big{background:var(--surface-2);border-radius:10px;padding:8px}
.big img{height:auto;max-height:180px}
.kv{font-size:13px;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:.5px solid var(--border)}
.kv span:first-child{color:var(--text-2)}
.hs{font-size:12px;margin:0;padding:5px 0;border-bottom:.5px solid var(--border)}
.hs b{font-weight:500}
h3.sh{font-size:13px;font-weight:500;margin:12px 0 4px}
.sm{font-size:13px;margin:0 0 10px;padding:8px 12px;background:var(--surface-1);border-radius:var(--radius);display:none}
.lgd{display:flex;gap:12px;font-size:12px;color:var(--text-2);margin:10px 0 0;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
#cv{display:none;margin:0 0 10px;background:var(--surface-1);border-radius:12px;padding:8px}
#cv video{width:100%;max-height:220px;border-radius:8px;background:#000}
.empty{font-size:13px;color:var(--text-2)}
.box{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.f2 label{font-size:12px;color:var(--text-2);display:block}
.f2 input,.f2 select{display:block;width:100%;margin-top:4px;font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px}
.pv2{background:var(--surface-2);border-radius:10px;padding:6px;max-width:260px}
@media(prefers-color-scheme:dark){.th,.big,.pv2{background:#E4E8E8}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nmx{font-size:12px}.cd{padding:6px 8px}}
@media(min-width:1100px){.wrap{max-width:1280px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
</style>

function $(i){return document.getElementById(i)}
function fd(d){var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],p=d.split('-');return +p[2]+' '+m[+p[1]-1]+' '+p[0]}
function esc(x){var e=document.createElement('div');e.textContent=x;return e.innerHTML}
function flagged(u){return u.c.some(function(c){return c[3]})}
function pills(u){return '<span class="pl '+SN[u.st][1]+'">'+SN[u.st][0]+'</span>'+(flagged(u)?'<span class="pl s-r">Needs repair</span>':'')}

  if(b.dataset.st){u.st=b.dataset.st;if(u.st=='a')u.loc='';else if(u.st=='m')u.loc='At repair workshop';else if(!u.loc)u.loc='Assigned to: '+(head?'head':'member');list();detail()}
  else if(b.dataset.clr){u.c.forEach(function(c){c[3]=0});list();detail()}
  else if(b.id=='po'){var v=$('cm').value.trim(),er=$('ce');
    if(!v){er.textContent='Write a comment first';er.style.display='block';return}
    var f=$('fl').checked;u.c.push([head?'Dr. Ahmed (head)':'Dr. Sara (member)',TODAY,v,f?1:0]);list();detail();if(f)$('nt').style.display='block'}
});
function openSerial(){var v=$('sc').value.trim().toUpperCase(),u=find(v);
  if(!u){showErr(v?'No tool with serial '+v+'. Check the number and try again.':'Enter a serial number first');return}
  $('er').style.display='none';reset();pick(u.s)}
$('scb').onclick=openSerial;
$('sc').addEventListener('input',function(e){q=e.target.value.trim();$('er').style.display='none';list()});
$('sc').addEventListener('keydown',function(e){if(e.key=='Enter'&&find(e.target.value.trim().toUpperCase()))openSerial()});
$('cam').onclick=function(){
  $('er').style.display='none';
  if(!window.BarcodeDetector||!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){showErr('Camera scanning is not available on this device. Enter the serial number instead.');return}
  navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(function(s){
    stream=s;var v=$('vd');v.srcObject=s;v.play();$('cv').style.display='block';
    var det=new BarcodeDetector({formats:['qr_code','code_128','ean_13']});
    tm=setInterval(function(){det.detect(v).then(function(c){if(c.length){var u=find(c[0].rawValue.trim().toUpperCase());stopCam();if(u){reset();pick(u.s)}else showErr('That code is not a registered tool.')}}).catch(function(){})},400)
  }).catch(function(){showErr('Camera access was blocked. Allow camera access in your browser and try again.')})};
$('cx').onclick=stopCam;
$('bell').onclick=function(){flt=!flt;list()};

/* ===== Add tool (heads only): choose a preset category and type, serial is suggested, registration date, optional photo ===== */
var CATS6=['Access','Optics','Hand instruments','Energy','Staplers','Gynecology and urology'];
var AP={cat:'Access',type:'TR',serial:'',auto:true,date:TODAY,name:'',l2:'',draw:'grasper',photo:null,err:''};
function L2(k){return (T[k][3]||T[k][0].replace(/[^A-Za-z]/g,'').slice(0,2)).toUpperCase()}
/* Tool code = first 2 letters of the tool name + its number among the same tools + registration date DDMMYY. The 5th grasper registered on 7 Nov 2026 is GR5071126. */
function genCode(){var p=AP.type=='__new'?((AP.l2||AP.name).replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()):L2(AP.type);if(p.length<2||!AP.date)return '';var n=U.filter(function(u){return L2(u.t)==p}).length+1,d=AP.date.split('-');return p+n+d[2]+d[1]+d[0].slice(2)}
function typesIn(c){return Object.keys(T).filter(function(k){return T[k][1]==c})}
function syncAdd(){$('addb').style.display=head?'inline-flex':'none';if(!head)$('addp').style.display='none'}
function addPanel(){
  var el=$('addp'),ts=typesIn(AP.cat);if(AP.type!='__new'&&ts.indexOf(AP.type)<0)AP.type=ts[0]||'__new';
  if(AP.auto)AP.serial=genCode();
  var dr=AP.type=='__new'?AP.draw:T[AP.type][2];
  el.innerHTML='<h3 class="sh" style="margin-top:0">Add a tool</h3><div class="f2">'
   +'<label>Category<select id="apc">'+CATS6.map(function(c){return '<option'+(c==AP.cat?' selected':'')+'>'+c+'</option>'}).join('')+'</select></label>'
   +'<label>Type<select id="apt">'+ts.map(function(k){return '<option value="'+k+'"'+(k==AP.type?' selected':'')+'>'+T[k][0]+'</option>'}).join('')+'<option value="__new"'+(AP.type=='__new'?' selected':'')+'>New type…</option></select></label>'
   +(AP.type=='__new'?'<label>New type name<input id="apn" value="'+esc(AP.name)+'" placeholder="for example Claw grasper"></label><label>Code letters (2)<input id="apl" maxlength="2" value="'+esc(AP.l2||AP.name.replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase())+'"></label><label>Closest drawing<select id="apd">'+TOOL_DRAWING_KEYS.map(function(k){return '<option'+(k==AP.draw?' selected':'')+'>'+k+'</option>'}).join('')+'</select></label>':'')
   +'<label>Tool code<input id="aps" value="'+esc(AP.serial)+'" placeholder="GR5071126"></label>'
   +'<label>Registration date<input id="apr" type="date" value="'+AP.date+'"></label>'
   +'<label>Photo (optional)<input id="app" type="file" accept="image/*" capture="environment"></label></div>'
   +'<div class="row" style="margin-top:10px"><div class="pv2" style="width:220px">'+(AP.photo?'<img src="'+AP.photo+'" alt="Photo preview" style="width:100%;border-radius:6px;display:block">':toolSvg(dr))+'</div></div>'
   +(AP.err?'<p class="er">'+AP.err+'</p>':'')
   +'<div class="row"><button class="pri" id="aps2">Save tool</button><button id="apg">Generate code</button><button id="apx">Cancel</button></div>';
  el.style.display='block'}
$('addb').onclick=function(){AP={cat:'Access',type:'TR',serial:'',auto:true,date:TODAY,name:'',l2:'',draw:'grasper',photo:null,err:''};$('dt').style.display='none';addPanel();$('addp').scrollIntoView({block:'nearest',behavior:'smooth'})};
$('addp').addEventListener('change',function(e){var t=e.target;
  if(t.id=='apc'){AP.cat=t.value;AP.type=typesIn(AP.cat)[0]||'__new';AP.auto=true;AP.err='';addPanel()}
  else if(t.id=='apt'){AP.type=t.value;AP.auto=true;AP.err='';addPanel()}
  else if(t.id=='apd'){AP.draw=t.value;addPanel()}
  else if(t.id=='apr'){AP.date=t.value;addPanel()}
  else if(t.id=='apl'){AP.l2=t.value.toUpperCase();addPanel()}
  else if(t.id=='app'&&t.files[0]){AP.photo=URL.createObjectURL(t.files[0]);addPanel()}});
$('addp').addEventListener('input',function(e){var t=e.target;if(t.id=='aps'){AP.serial=t.value;AP.auto=false}if(t.id=='apn')AP.name=t.value;if(t.id=='apr')AP.date=t.value});
$('addp').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id=='apx'){$('addp').style.display='none';return}
  if(b.id=='apg'){AP.auto=true;addPanel();return}
  if(b.id=='aps2'){var s=AP.serial.trim().toUpperCase(),code=AP.type;
    if(AP.type=='__new'){if(AP.name.trim().length<3){AP.err='Type a name for the new type (at least 3 letters).';return addPanel()}
      var w=AP.name.trim().toUpperCase().replace(/[^A-Z ]/g,'').split(' '),c=(w[0].charAt(0)+(w[1]?w[1].charAt(0):w[0].charAt(1))).toUpperCase(),n=0;while(T[c+(n||'')])n++;code=c+(n||'')}
    if(!/^[A-Z]{2}\d{1,4}\d{6}$/.test(s)){AP.err='The code should look like GR5071126: 2 letters, a number, then the date (DDMMYY).';return addPanel()}
    if(find(s)){AP.err='That code is already registered.';return addPanel()}
    if(!AP.date||AP.date>TODAY){AP.err='Choose a registration date that is not in the future.';return addPanel()}
    if(AP.type=='__new')T[code]=[AP.name.trim(),AP.cat,AP.draw,(AP.l2||AP.name).replace(/[^A-Za-z]/g,'').slice(0,2).toUpperCase()];
    U.push({s:s,t:code,st:'a',reg:AP.date,last:AP.date,loc:'',h:[[AP.date,'Registered','Added to the inventory']],c:[],photo:AP.photo||undefined});
    $('addp').style.display='none';reset();pick(s)}});
syncAdd();
list();

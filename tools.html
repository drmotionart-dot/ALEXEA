<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tools · ALEXEA Course Manager</title>
<style>
:root{
  --page:#FAF9F5;--surface-1:#F1EFE8;--surface-2:#FFFFFF;
  --border:rgba(20,20,19,.15);--border-strong:rgba(20,20,19,.30);--border-stronger:rgba(20,20,19,.50);
  --text:#141413;--text-2:#5E5D59;
  --bg-accent:#DCE9F8;--text-accent:#1F5FA6;
  --bg-ok:#DDEFD0;--text-ok:#2F6B14;
  --bg-warn:#FBEBC4;--text-warn:#7A5600;
  --bg-bad:#F8D9D5;--text-bad:#9B2C20;
  --radius:8px;
}
@media (prefers-color-scheme:dark){:root{
  --page:#1F1E1D;--surface-1:#2B2A28;--surface-2:#262624;
  --border:rgba(250,249,245,.15);--border-strong:rgba(250,249,245,.30);--border-stronger:rgba(250,249,245,.50);
  --text:#FAF9F5;--text-2:#B8B6AD;
  --bg-accent:#1D3A5C;--text-accent:#A9CDF5;
  --bg-ok:#1E3F14;--text-ok:#B4E09A;
  --bg-warn:#4A3A12;--text-warn:#F0CE82;
  --bg-bad:#4D2420;--text-bad:#F5B5AC;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic",Roboto,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
button{background:transparent;border:.5px solid var(--border-strong);border-radius:var(--radius);padding:6px 12px;font:inherit;font-size:14px;color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:6px}
button:hover{background:var(--surface-1)}
button:active{transform:scale(.98)}
button:focus-visible,input:focus-visible,.cd:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
button.on{background:var(--surface-1);border-color:var(--border-stronger)}
input[type=text],input:not([type]){font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px}
svg.i{width:16px;height:16px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.row .lb{font-size:12px;color:var(--text-2);min-width:52px}
.sc{flex:1;min-width:150px}
.er{font-size:13px;color:var(--text-bad);margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cd{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:8px 10px;cursor:pointer}
.cd:hover{border-color:var(--border-strong)}
.cd.sl{border-color:var(--text)}
.th{background:var(--surface-2);border-radius:8px;padding:2px 4px;overflow:hidden}
.th img,.big img{width:100%;height:90px;object-fit:cover;display:block;border-radius:6px}
.nmx{font-size:13px;font-weight:500;margin:6px 0 0}
.sr{font-size:11px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;margin:0 0 4px}
.lc{font-size:12px;color:var(--text-2);margin:4px 0 0}
.pl{font-size:11px;padding:1px 8px;border-radius:var(--radius);display:inline-block;margin-right:4px}
.s-a{background:var(--bg-ok);color:var(--text-ok)}
.s-u{background:var(--bg-accent);color:var(--text-accent)}
.s-m{background:var(--bg-warn);color:var(--text-warn)}
.s-r{background:var(--bg-bad);color:var(--text-bad)}
#dt{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px;display:none}
.dg{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px}
@media(max-width:560px){.dg{grid-template-columns:minmax(0,1fr)}}
.big{background:var(--surface-2);border-radius:10px;padding:8px}
.big img{height:auto;max-height:180px}
.kv{font-size:13px;display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:.5px solid var(--border)}
.kv span:first-child{color:var(--text-2)}
.hs{font-size:12px;margin:0;padding:5px 0;border-bottom:.5px solid var(--border)}
.hs b{font-weight:500}
h3.sh{font-size:13px;font-weight:500;margin:12px 0 4px}
.sm{font-size:13px;margin:0 0 10px;padding:8px 12px;background:var(--surface-1);border-radius:var(--radius);display:none}
.lgd{display:flex;gap:12px;font-size:12px;color:var(--text-2);margin:10px 0 0;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:4px}
#cv{display:none;margin:0 0 10px;background:var(--surface-1);border-radius:12px;padding:8px}
#cv video{width:100%;max-height:220px;border-radius:8px;background:#000}
.empty{font-size:13px;color:var(--text-2)}
.box{background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.f2 label{font-size:12px;color:var(--text-2);display:block}
.f2 input,.f2 select{display:block;width:100%;margin-top:4px;font:inherit;font-size:14px;color:var(--text);background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:var(--radius);padding:7px 10px}
.pv2{background:var(--surface-2);border-radius:10px;padding:6px;max-width:260px}
@media(prefers-color-scheme:dark){.th,.big,.pv2{background:#E4E8E8}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.nmx{font-size:12px}.cd{padding:6px 8px}}
@media(min-width:1100px){.wrap{max-width:1280px}.grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
</style>
<link rel="stylesheet" href="topbar.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="/home" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="/home">Home</a><a href="/calendar">Calendar</a><a href="/hands-on">Hands-on</a><a href="/attendance">Attendance</a><a class="cur" href="/tools">Tools</a><a href="/candidates">Candidates</a><a href="/activity">Activity</a><a href="/account">Account</a></nav>
</header>

<div class="row">
  <input id="sc" class="sc" placeholder="Search tools, or enter a serial such as GR5071126" aria-label="Search tools or serial">
  <button id="scb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M4 12h16"/></svg>Open serial</button>
  <button id="cam"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 7h2l2-3h6l2 3h2a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>Scan with camera</button>
  <button id="addb"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add tool</button>
  <button id="bell" aria-label="Repair notifications"><svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/></svg><span id="bc">0</span></button>
</div>
<p class="er" id="er" style="display:none"></p>
<div id="cv"><video id="vd" playsinline muted></video><div class="row" style="margin:6px 0 0"><span style="font-size:12px;color:var(--text-2)">Point at the QR code or barcode on the tool</span><button id="cx">Close camera</button></div></div>

<div class="row" id="ct"></div>
<div class="row" id="sfr"></div>
<div class="sm" id="sm"></div>
<div id="addp" class="box" style="display:none"></div>
<div id="dt"></div>
<div class="grid" id="g"></div>
<div class="lgd"><span>Lens codes</span><span><span class="dot" style="background:#1D9E75"></span>0° green</span><span><span class="dot" style="background:#E24B4A"></span>30° red</span><span><span class="dot" style="background:#1a1a1a;border:.5px solid var(--border-strong)"></span>Chameleon black</span></div>
</div>
<script src="install.js"></script>
<script src="tool-drawings.js"></script>
<script>
var head = false, tools = [], types = [], cat = 'All', flt = false, sf2 = 'all', q = '', selId = null;
var cats = ['All', 'Access', 'Optics', 'Hand instruments', 'Energy', 'Staplers', 'Gynecology and urology'];
var SN = { available: ['Available', 's-a'], inuse: ['In use', 's-u'], maintenance: ['Maintenance', 's-m'] };
var PH = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><circle cx="9" cy="10" r="1.5"/><path d="M4 17l5-4 4 3 3-2 4 3"/></svg>';
var stream = null, tm = null, scanner = null;

function $(i) { return document.getElementById(i); }
function esc(x) { var e = document.createElement('div'); e.textContent = x == null ? '' : x; return e.innerHTML; }
function fd(d) { if (!d) return '—'; var k = String(d).slice(0, 10); var m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], p = k.split('-'); return (+p[2]) + ' ' + m[+p[1] - 1] + ' ' + p[0]; }
function fdt(d) { if (!d) return '—'; var dt = new Date(d); return fd(dt.toISOString()); }
function find(id) { for (var i = 0; i < tools.length; i++) if (String(tools[i]._id) === String(id)) return tools[i]; return null; }
function flagged(t) { return (t.comments || []).some(function (c) { return c.needsRepair && !c.resolved; }); }
function pills(t) { var s = SN[t.status] || ['Available', 's-a']; return '<span class="pl ' + s[1] + '">' + s[0] + '</span>' + (flagged(t) ? '<span class="pl s-r">Needs repair</span>' : ''); }
function drawing(t) { return (t.type && t.type.drawing) || 'grasper'; }
function pic(t) { return t.photoUrl ? '<img src="' + esc(t.photoUrl) + '" alt="Photo of ' + esc(t.serial) + '">' : toolSvg(drawing(t)); }
function locText(t) { var l = t.location; if (!l) return ''; if (typeof l === 'string') return l; return l.text || l.station || ''; }
function showErr(m) { var e = $('er'); e.textContent = m || ''; e.style.display = m ? 'block' : 'none'; }

/* ---------- list ---------- */
function filtered() {
  var ql = q.toLowerCase();
  var r = tools.filter(function (t) {
    var ty = t.type || {};
    if (cat !== 'All' && ty.category !== cat) return false;
    if (flt && !flagged(t)) return false;
    if (sf2 !== 'all' && t.status !== sf2) return false;
    if (ql && (String(ty.name || '') + ' ' + t.serial).toLowerCase().indexOf(ql) < 0) return false;
    return true;
  });
  if (ql) { var o = { inuse: 0, available: 1, maintenance: 2 }; r.sort(function (a, b) { return (o[a.status] == null ? 3 : o[a.status]) - (o[b.status] == null ? 3 : o[b.status]); }); }
  return r;
}
function list() {
  var r = filtered();
  $('g').innerHTML = r.map(function (t) {
    var ty = t.type || {};
    return '<div class="cd' + (selId === String(t._id) ? ' sl' : '') + '" data-id="' + t._id + '" tabindex="0" role="button"><div class="th">' + pic(t) + '</div><p class="nmx" dir="auto">' + esc(ty.name || 'Tool') + '</p><p class="sr">' + esc(t.serial) + '</p>' + pills(t) + (locText(t) ? '<p class="lc" dir="auto">' + esc(locText(t)) + '</p>' : '') + '</div>';
  }).join('') || '<p class="empty">' + (!tools.length ? 'No tools are registered yet. Use Add tool to register the first one.' : 'No tools match. Try another name or clear the filters.') + '</p>';

  var sm = $('sm'), ql = q.toLowerCase();
  if (ql && r.length) {
    var n = { inuse: 0, available: 0, maintenance: 0 };
    r.forEach(function (t) { n[t.status] = (n[t.status] || 0) + 1; });
    sm.innerHTML = '<b style="font-weight:500">' + r.length + ' match</b> · ' + n.inuse + ' in use · ' + n.available + ' available · ' + n.maintenance + ' in maintenance';
    sm.style.display = 'block';
  } else sm.style.display = 'none';

  var flaggedCount = tools.filter(flagged).length;
  $('bc').textContent = flaggedCount;
  $('bell').className = flt ? 'on' : '';
  $('ct').innerHTML = '<span class="lb">Type</span>' + cats.map(function (c) { return '<button data-c="' + c + '" class="' + (c === cat ? 'on' : '') + '">' + c + '</button>'; }).join('');
  var sfs = [['all', 'All'], ['inuse', 'In use'], ['available', 'Available'], ['maintenance', 'Maintenance']];
  $('sfr').innerHTML = '<span class="lb">Status</span>' + sfs.map(function (x) { return '<button data-f="' + x[0] + '" class="' + (sf2 === x[0] ? 'on' : '') + '">' + x[1] + '</button>'; }).join('');
  $('addb').style.display = head ? 'inline-flex' : 'none';
}

/* ---------- detail ---------- */
function detail() {
  var el = $('dt'), t = selId ? find(selId) : null;
  if (!t) { el.style.display = 'none'; return; }
  var ty = t.type || {}, reg = t.registeredAt, yrs = reg ? Math.floor((Date.now() - new Date(reg)) / 31557600000) : 0;
  var h = '<div class="dg"><div><div class="big">' + pic(t) + '</div>'
    + (head ? '<div class="row" style="margin:8px 0 0"><button id="ph">' + PH + (t.photoUrl ? 'Replace photo' : 'Add photo') + '</button>' + (t.photoUrl ? '<button id="nph">Use drawing</button>' : '') + '<button id="qr">QR label</button><button data-del="1">Delete tool</button><input type="file" id="pf" accept="image/*" capture="environment" style="display:none"></div>' : '<div class="row" style="margin:8px 0 0"><button id="qr">QR label</button></div>')
    + '<p class="nmx" style="font-size:16px" dir="auto">' + esc(ty.name || 'Tool') + '</p><p class="sr" style="font-size:12px">' + esc(t.serial) + '</p>' + pills(t) + '</div><div>';
  h += '<div class="kv"><span>Registered</span><span>' + fd(reg) + ' · ' + yrs + ' yr</span></div>'
    + '<div class="kv"><span>Last maintenance</span><span>' + fd(t.lastMaintenanceAt) + '</span></div>'
    + '<div class="kv"><span>Location</span><span style="text-align:right" dir="auto">' + (locText(t) ? esc(locText(t)) : 'In stock') + '</span></div>';
  if (head) {
    h += '<div class="row" style="margin-top:10px"><span class="lb">Status</span><button data-st="available">Available</button><button data-st="inuse">In use</button><button data-st="maintenance">Maintenance</button></div>'
      + (flagged(t) ? '<div class="row"><button data-clr="1">Clear repair flag</button></div>' : '');
  } else {
    h += '<div class="row" style="margin-top:10px"><button data-st="inuse">Start using</button><button data-st="available">Return to stock</button></div>';
  }
  h += '</div></div><h3 class="sh">Maintenance history</h3>' + ((t.history || []).length ? (t.history || []).map(function (x) { return '<p class="hs"><b>' + fd(x.date) + '</b> · ' + esc(x.kind) + ' — ' + esc(x.note) + '</p>'; }).join('') : '<p class="hs empty">No history yet.</p>');
  h += '<h3 class="sh">Reports and comments</h3>' + ((t.comments || []).length ? (t.comments || []).map(function (x) { return '<p class="hs"><b>' + esc(x.by) + '</b> · ' + fdt(x.date) + (x.needsRepair ? ' <span class="pl s-r">Repair</span>' : '') + (x.resolved ? ' <span class="pl s-a">Resolved</span>' : '') + '<br><span dir="auto">' + esc(x.text) + '</span></p>'; }).join('') : '<p class="hs empty">No comments yet.</p>');
  h += '<div class="row" style="margin-top:8px"><input id="cm" dir="auto" placeholder="Leave a comment" style="flex:1;min-width:140px"><label style="font-size:12px;display:flex;align-items:center;gap:4px"><input type="checkbox" id="fl"> Needs repair</label><button id="po">Post</button></div><p class="er" id="ce" style="display:none"></p><p id="nt" style="font-size:12px;color:var(--text-ok);display:none;margin:4px 0 0">Heads notified.</p>';
  el.innerHTML = h; el.style.display = 'block';

  var pf = $('pf'), ph = $('ph');
  if (ph && pf) {
    ph.onclick = function () { pf.click(); };
    pf.onchange = async function (e) {
      var f = e.target.files[0]; if (!f) return;
      try {
        var url = await uploadPhoto(f);
        await api('/api/tools/' + t._id, { method: 'PATCH', body: JSON.stringify({ photoUrl: url }) });
        t.photoUrl = url; list(); detail();
      } catch (ex) { alert(ex.message); }
    };
    var n = $('nph');
    if (n) n.onclick = async function () {
      try { await api('/api/tools/' + t._id, { method: 'PATCH', body: JSON.stringify({ photoUrl: null }) }); t.photoUrl = null; list(); detail(); }
      catch (ex) { alert(ex.message); }
    };
  }
  var qb = $('qr');
  if (qb) qb.onclick = function () { printLabel(t); };
}
function pick(id) { selId = String(id); list(); detail(); $('dt').scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }

/* ---------- photo upload (compress to about 100 KB) ---------- */
function compress(file) {
  return new Promise(function (resolve, reject) {
    var img = new Image();
    img.onload = function () {
      var max = 1280, w = img.width, h = img.height;
      if (w > max || h > max) { var s = Math.min(max / w, max / h); w = Math.round(w * s); h = Math.round(h * s); }
      var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      var qy = 0.8, out;
      for (var i = 0; i < 6; i++) {
        out = cv.toDataURL('image/jpeg', qy);
        if (out.length * 0.75 <= 100 * 1024) break;
        qy -= 0.12;
      }
      resolve(out);
    };
    img.onerror = function () { reject(new Error('That file is not an image.')); };
    img.src = URL.createObjectURL(file);
  });
}
async function uploadPhoto(file) {
  var dataUrl = await compress(file);
  var cfg = window.APP_CONFIG || {};
  var fd2 = new FormData();
  fd2.append('file', dataUrl);
  fd2.append('upload_preset', cfg.CLOUDINARY_UPLOAD_PRESET);
  var r = await fetch('https://api.cloudinary.com/v1_1/' + cfg.CLOUDINARY_CLOUD_NAME + '/image/upload', { method: 'POST', body: fd2 });
  var j = await r.json();
  if (!r.ok || !j.secure_url) throw new Error(j.error && j.error.message || 'Photo upload failed');
  return j.secure_url;
}

/* ---------- QR label ---------- */
function printLabel(t) {
  var url = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(t.serial);
  var w = window.open('', '_blank');
  if (!w) return;
  w.document.write('<!doctype html><title>' + esc(t.serial) + '</title><body style="font-family:system-ui,sans-serif;text-align:center;padding:24px">'
    + '<img src="' + url + '" alt="QR ' + esc(t.serial) + '" style="width:220px;height:220px">'
    + '<div style="font:600 18px ui-monospace,monospace;margin-top:8px">' + esc(t.serial) + '</div>'
    + '<div style="font-size:14px;color:#444;margin-top:2px">' + esc((t.type && t.type.name) || '') + '</div>'
    + '<script>setTimeout(function(){window.print()},600)<\/script></body>');
  w.document.close();
}

/* ---------- events on the grid and detail ---------- */
$('g').addEventListener('click', function (e) { var c = e.target.closest('.cd'); if (c) pick(c.dataset.id); });
$('g').addEventListener('keydown', function (e) { if (e.key === 'Enter') { var c = e.target.closest('.cd'); if (c) pick(c.dataset.id); } });
$('ct').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { cat = b.dataset.c; flt = false; list(); } });
$('sfr').addEventListener('click', function (e) { var b = e.target.closest('button'); if (b) { sf2 = b.dataset.f; list(); } });

$('dt').addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b) return;
  var t = find(selId); if (!t) return;
  if (b.dataset.st) {
    if (b.dataset.st === 'maintenance' && !head) return;
    b.disabled = true;
    try {
      var r = await api('/api/tools/' + t._id, { method: 'PATCH', body: JSON.stringify({ status: b.dataset.st }) });
      t.status = r.tool.status; t.history = r.tool.history; t.lastMaintenanceAt = r.tool.lastMaintenanceAt;
      list(); detail();
    } catch (ex) { alert(ex.message); }
    finally { b.disabled = false; }
    return;
  }
  if (b.dataset.del) {
    if (!window.confirm('Remove ' + t.serial + ' from the inventory? This cannot be undone.')) return;
    b.disabled = true;
    try {
      await api('/api/tools/' + t._id, { method: 'DELETE' });
      selId = null;
      await refreshTool(t._id);
      list();
      $('dt').style.display = 'none';
    } catch (ex) { alert(ex.message); }
    finally { b.disabled = false; }
    return;
  }
  if (b.dataset.clr) {
    b.disabled = true;
    try {
      var cs = t.comments || [];
      for (var i = 0; i < cs.length; i++) {
        if (cs[i].needsRepair && !cs[i].resolved) await api('/api/tools/' + t._id + '/comments/' + i + '/resolve', { method: 'PATCH', body: '{}' });
      }
      await refreshTool(t._id);
      list(); detail();
    } catch (ex) { alert(ex.message); }
    finally { b.disabled = false; }
    return;
  }
  if (b.id === 'po') {
    var v = ($('cm').value || '').trim(), er = $('ce');
    if (!v) { er.textContent = 'Write a comment first'; er.style.display = 'block'; return; }
    er.style.display = 'none';
    b.disabled = true;
    try {
      var needs = $('fl').checked;
      await api('/api/tools/' + t._id + '/comments', { method: 'POST', body: JSON.stringify({ text: v, needsRepair: needs }) });
      await refreshTool(t._id);
      list(); detail();
      if (needs) { var nt = $('nt'); if (nt) nt.style.display = 'block'; }
    } catch (ex) { er.textContent = ex.message; er.style.display = 'block'; }
    finally { b.disabled = false; }
  }
});

async function refreshTool(id) {
  var d = await api('/api/tools');
  tools = d.tools || [];
  return find(id);
}

/* ---------- serial + search + camera ---------- */
async function openSerial() {
  var v = ($('sc').value || '').trim().toUpperCase();
  if (!v) return showErr('Enter a serial number first');
  showErr('');
  try {
    var d = await api('/api/tools/serial/' + encodeURIComponent(v));
    await refreshTool(d.tool._id);
    cat = 'All'; flt = false; sf2 = 'all'; q = '';
    pick(d.tool._id);
  } catch (ex) {
    showErr('No tool with serial ' + v + '. Check the number and try again.');
  }
}
$('scb').onclick = openSerial;
$('sc').addEventListener('input', function (e) { q = e.target.value.trim(); showErr(''); list(); });
$('sc').addEventListener('keydown', function (e) { if (e.key === 'Enter') openSerial(); });

function stopCam() {
  if (tm) { clearInterval(tm); tm = null; }
  if (scanner) { try { scanner.stop(); } catch (x) {} try { scanner.clear(); } catch (x) {} scanner = null; }
  if (stream) { stream.getTracks().forEach(function (t) { t.stop(); }); stream = null; }
  $('cv').style.display = 'none';
}
$('cx').onclick = stopCam;

function handleCode(raw) {
  var code = String(raw || '').trim().toUpperCase();
  if (!code) return;
  stopCam();
  api('/api/tools/serial/' + encodeURIComponent(code)).then(function (d) {
    return refreshTool(d.tool._id);
  }).then(function (t) {
    if (!t) return showErr('That code is not a registered tool.');
    cat = 'All'; flt = false; sf2 = 'all'; q = '';
    pick(t._id);
  }).catch(function () { showErr('That code is not a registered tool.'); });
}

function loadScript(src) {
  return new Promise(function (resolve, reject) {
    var s = document.createElement('script'); s.src = src; s.onload = resolve; s.onerror = reject; document.head.appendChild(s);
  });
}

$('cam').onclick = async function () {
  showErr('');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    return showErr('Camera scanning is not available on this device. Enter the serial number instead.');
  }
  $('cv').style.display = 'block';
  try {
    if ('BarcodeDetector' in window) {
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      var v = $('vd'); v.srcObject = stream; await v.play();
      var det = new BarcodeDetector({ formats: ['qr_code', 'code_128', 'ean_13', 'code_39'] });
      tm = setInterval(function () {
        det.detect(v).then(function (c) { if (c && c.length) handleCode(c[0].rawValue); }).catch(function () {});
      }, 400);
      return;
    }
    // fallback: html5-qrcode from a CDN
    if (!window.Html5Qrcode) await loadScript('https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js');
    var holder = document.createElement('div'); holder.id = 'reader'; holder.style.width = '100%';
    $('cv').insertBefore(holder, $('cv').firstChild);
    scanner = new Html5Qrcode('reader');
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, function (txt) { handleCode(txt); }, function () {});
  } catch (ex) {
    stopCam();
    showErr('Camera access was blocked or no scanner is available. Allow camera access in your browser, or enter the serial number instead.');
  }
};

$('bell').onclick = function () { flt = !flt; list(); };

/* ---------- add tool (heads only) ---------- */
var AP = { cat: 'Access', typeId: '', code: '', auto: true, date: new Date().toISOString().slice(0, 10), name: '', l2: '', draw: 'grasper', photo: null, err: '', serial: '' };
function typesIn(c) { return types.filter(function (t) { return t.category === c; }); }
function cleanAdd() { return { cat: 'Access', typeId: '', code: '', auto: true, date: new Date().toISOString().slice(0, 10), name: '', l2: '', draw: 'grasper', photo: null, err: '', serial: '' }; }

function addPanel() {
  var el = $('addp'), ts = typesIn(AP.cat);
  if (AP.typeId !== '__new' && !ts.some(function (t) { return String(t._id) === AP.typeId; })) AP.typeId = ts.length ? String(ts[0]._id) : '__new';
  var cur = ts.filter(function (t) { return String(t._id) === AP.typeId; })[0];
  var dr = AP.typeId === '__new' ? AP.draw : (cur ? cur.drawing : 'grasper');
  var codeLetters = AP.typeId === '__new' ? (AP.l2 || '') : (cur ? cur.code : '');
  el.innerHTML = '<h3 class="sh" style="margin-top:0">Add a tool</h3><div class="f2">'
    + '<label>Category<select id="apc">' + cats.slice(1).map(function (c) { return '<option' + (c === AP.cat ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></label>'
    + '<label>Type<select id="apt">' + ts.map(function (t) { return '<option value="' + t._id + '"' + (String(t._id) === AP.typeId ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') + '<option value="__new"' + (AP.typeId === '__new' ? ' selected' : '') + '>New type…</option></select></label>'
    + (AP.typeId === '__new' ? '<label>New type name<input id="apn" value="' + esc(AP.name) + '" placeholder="for example Claw grasper"></label><label>Code letters (2)<input id="apl" maxlength="2" value="' + esc(codeLetters) + '"></label><label>Closest drawing<select id="apd">' + TOOL_DRAWING_KEYS.map(function (k) { return '<option' + (k === AP.draw ? ' selected' : '') + '>' + k + '</option>'; }).join('') + '</select></label>' : '')
    + '<label>Tool code<input id="aps" value="' + esc(AP.serial) + '" placeholder="GR5071126"></label>'
    + '<label>Registration date<input id="apr" type="date" value="' + AP.date + '"></label>'
    + '<label>Photo (optional)<input id="app" type="file" accept="image/*" capture="environment"></label></div>'
    + '<div class="row" style="margin-top:10px"><div class="pv2" style="width:220px">' + (AP.photo ? '<img src="' + AP.photo + '" alt="Photo preview" style="width:100%;border-radius:6px;display:block">' : toolSvg(dr)) + '</div></div>'
    + (AP.err ? '<p class="er">' + esc(AP.err) + '</p>' : '')
    + '<div class="row"><button class="pri" id="aps2">Save tool</button><button id="apg">Generate code</button><button id="apx">Cancel</button></div>';
  el.style.display = 'block';
}

async function suggestCode() {
  var ts = typesIn(AP.cat), cur = ts.filter(function (t) { return String(t._id) === AP.typeId; })[0];
  var letters = AP.typeId === '__new'
    ? (AP.l2 || AP.name.replace(/[^A-Za-z]/g, '').slice(0, 2)).toUpperCase()
    : (cur ? cur.code : 'XX');
  if (letters.length < 2 || !AP.date) { AP.serial = ''; return; }
  try {
    var d = await api('/api/tools/suggest-code?typeCode=' + encodeURIComponent(letters) + '&date=' + AP.date);
    AP.serial = d.code;
  } catch (ex) { AP.serial = ''; }
}

$('addb').onclick = async function () {
  if (!head) return;
  AP = cleanAdd();
  $('dt').style.display = 'none';
  addPanel();
  await suggestCode();
  addPanel();
  $('addp').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
};

$('addp').addEventListener('change', async function (e) {
  var t = e.target;
  if (t.id === 'apc') { AP.cat = t.value; AP.typeId = ''; AP.err = ''; await suggestCode(); addPanel(); }
  else if (t.id === 'apt') { AP.typeId = t.value; AP.err = ''; await suggestCode(); addPanel(); }
  else if (t.id === 'apd') { AP.draw = t.value; addPanel(); }
  else if (t.id === 'apr') { AP.date = t.value; if (AP.auto) await suggestCode(); addPanel(); }
  else if (t.id === 'apl') { AP.l2 = t.value.toUpperCase(); if (AP.auto) await suggestCode(); addPanel(); }
  else if (t.id === 'app' && t.files[0]) {
    try { AP.photo = await compress(t.files[0]); } catch (ex) { AP.photo = null; }
    addPanel();
  }
});
$('addp').addEventListener('input', function (e) {
  var t = e.target;
  if (t.id === 'aps') { AP.serial = t.value.toUpperCase(); AP.auto = false; }
  if (t.id === 'apn') AP.name = t.value;
  if (t.id === 'apl') AP.l2 = t.value.toUpperCase();
});
$('addp').addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b) return;
  if (b.id === 'apx') { $('addp').style.display = 'none'; return; }
  if (b.id === 'apg') { AP.auto = true; await suggestCode(); addPanel(); return; }
  if (b.id === 'aps2') {
    var s = (AP.serial || '').trim().toUpperCase();
    AP.serial = s;
    AP.err = '';
    if (AP.typeId === '__new' && AP.name.trim().length < 3) { AP.err = 'Type a name for the new type (at least 3 letters).'; return addPanel(); }
    if (!/^[A-Z]{2}\d{1,4}\d{6}$/.test(s)) { AP.err = 'The code should look like GR5071126: 2 letters, a number, then the date (DDMMYY).'; return addPanel(); }
    if (!AP.date || AP.date > new Date().toISOString().slice(0, 10)) { AP.err = 'Choose a registration date that is not in the future.'; return addPanel(); }
    b.disabled = true;
    try {
      var body = { serial: s, registeredAt: AP.date, status: 'available' };
      if (AP.typeId === '__new') { body.typeName = AP.name.trim(); body.category = AP.cat; body.drawing = AP.draw; body.typeCode = (AP.l2 || AP.name).replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase(); }
      else body.typeId = AP.typeId;
      if (AP.photo) body.photoUrl = await uploadPhoto(dataUrlToFile(AP.photo));
      var r = await api('/api/tools', { method: 'POST', body: JSON.stringify(body) });
      $('addp').style.display = 'none';
      var d = await api('/api/tools');
      tools = d.tools || [];
      var dt = await api('/api/tools/types'); types = dt.types || [];
      cat = 'All'; flt = false; sf2 = 'all'; q = '';
      pick(r.id);
    } catch (ex) { AP.err = ex.message; addPanel(); }
    finally { b.disabled = false; }
  }
});
function dataUrlToFile(dataUrl) {
  var arr = dataUrl.split(','), m = arr[0].match(/:(.*?);/), b = atob(arr[1]), n = b.length;
  var u8 = new Uint8Array(n);
  for (var i = 0; i < n; i++) u8[i] = b.charCodeAt(i);
  return new File([u8], 'tool.jpg', { type: m[1] });
}

/* ---------- boot ---------- */
(async function () {
  if (!session.requireAuth()) return;
  head = session.isHead();
  try {
    var t = await api('/api/tools/types'); types = t.types || [];
    var d = await api('/api/tools'); tools = d.tools || [];
  } catch (ex) { showErr(ex.message); }
  list();
  var qid = new URLSearchParams(location.search).get('serial');
  if (qid) { $('sc').value = qid; openSerial(); }
})();
</script>
</body>

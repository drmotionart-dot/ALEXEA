<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Candidate import and review · design source of truth</title>
<link rel="stylesheet" href="shared.css">
<!--
  DESIGN SOURCE OF TRUTH: candidate import (paste, CSV/Excel, PDF, typed photo) and the review screen.
  Match exactly. Do not restyle. Nothing is saved until a head presses Confirm.
  The matching below is a tiny SAMPLE to show the behavior; the real rules are in
  docs/PLACEMENT_AND_MATCHING.md (normalization, sound keys, fuzzy match, 0.90 / 0.70 thresholds,
  hierarchy city -> country, alias learning). Paste column order: Name, Country, City, Hospital, Experience (years).
-->
<style>
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.rv{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.rv.ph{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}
@media(max-width:700px){.rv.ph{grid-template-columns:minmax(0,1fr)}}
.photo{background:var(--surface-2);border:.5px dashed var(--border-strong);border-radius:12px;min-height:160px;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;font-size:13px;color:var(--text-2)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}
th{font-weight:500;color:var(--text-2);text-align:left;padding:4px 8px;font-size:12px}
td{padding:6px 8px;border-top:.5px solid var(--border);vertical-align:top}
td input,td select{padding:4px 6px;font-size:13px;width:100%}
td input.exp{width:60px}
.cell .raw{display:block;margin-bottom:3px}
.ch{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.ch button{padding:1px 8px;font-size:12px}
.gq{background:var(--bg-warn);border:.5px dashed var(--border-warn)}
.cn{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="home.html" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="home.html">Home</a><a href="calendar.html">Calendar</a><a href="hands-on.html">Hands-on</a><a href="attendance.html">Attendance</a><a href="tools.html">Tools</a><a class="cur" href="import.html">Candidates</a><a href="activity.html">Activity</a><a href="accounts.html">Account</a></nav>
</header>
<div class="hero"><h1>Add candidates</h1><p>Basic Laparoscopic Surgery · Sun 8 Nov 2026. Candidates fill in the sheet themselves, in Arabic or English. Heads review before anything is saved.</p></div>
<div class="stps" id="stps"></div>
<div id="s1">
  <div class="tabs"><button data-m="paste" class="on">Paste a table</button><button data-m="file">CSV or Excel</button><button data-m="pdf">PDF</button><button data-m="photo">Photo</button></div>
  <div id="in"></div>
</div>
<div id="s2" style="display:none"></div>
</div>
<script src="install.js"></script>
<script>
var SAMPLE='Ahmed Hassan\tEgypt\tAlexandria\tAlexandria Main University Hospital\t4\nسارة محمود\tمصر\tالاسكندرية\tالمستشفى الجامعي\t3\nOmar Khaled\tSudanese\tKhartom\tSoba Hospital\t5\nفاطمة علي\tالسودان\tالخرطوم\tمستشفى سوبا\t2\nMostafa Idris\tSudan\tKairo\tKasr Alainy\t6\nNour Salem\tEgypt\tCairo\tKasr Alainy hospital\t1';
var mode='paste',rows=[],err='';
/* SAMPLE places. In the real app these come from the places collection (aliases grow as heads confirm matches). */
var P={
 country:[['Egypt',['egypt','egyptian','مصر','مصري']],['Sudan',['sudan','sudanese','السودان','سوداني']],['Libya',['libya','libyan','ليبيا']],['Saudi Arabia',['saudi arabia','saudi','السعودية']]],
 city:[['Cairo',['cairo','القاهره'],'Egypt'],['Alexandria',['alexandria','alex','الاسكندريه','اسكندريه'],'Egypt'],['Khartoum',['khartoum','الخرطوم'],'Sudan']],
 hospital:[['Kasr Alainy',['kasr alainy','قصر العيني']],['Alexandria Main University Hospital',['alexandria main','الجامعي']],['Soba University Hospital',['soba','سوبا']]]};
var NAMES={m:['ahmed','mohamed','omar','mostafa','khaled','احمد','محمد','عمر','مصطفي'],f:['sara','nour','mariam','fatma','fatima','سارة','ساره','فاطمه','مريم']};
function $(i){return document.getElementById(i)}
function steps(n){var s=['Add','Review','Saved'];$('stps').innerHTML=s.map(function(t,i){return '<div class="s'+(i+1==n?' on':i+1<n?' done':'')+'"><b>'+(i+1<n?'✓':i+1)+'</b>'+t+'</div>'}).join('')}
function raw(t){if(!t)return '<span class="raw nt">empty</span>';var ar=/[\u0600-\u06FF]/.test(t);return '<span class="raw"><span class="sc">'+(ar?'ع':'EN')+'</span><span dir="auto">'+esc(t)+'</span></span>'}
function esc(x){var e=document.createElement('div');e.textContent=x;return e.innerHTML}
function norm(s){s=(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه');return s.split(/\s+/).filter(function(w){return w&&!/^(hospital|university|مستشفي|المستشفي)$/.test(w)}).join(' ')}
function lev(a,b){var d=[],i,j;for(i=0;i<=a.length;i++){d[i]=[i]}for(j=1;j<=b.length;j++)d[0][j]=j;for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]==b[j-1]?0:1));return d[a.length][b.length]}
function match(type,raw){var t=norm(raw);if(!t)return {k:'none'};var best=null,bd=9;
  for(var i=0;i<P[type].length;i++){var p=P[type][i];for(var j=0;j<p[1].length;j++){var a=norm(p[1][j]);if(a==t)return {k:'ok',v:p[0],p:p[2]};var d=lev(a,t);if(d<bd&&t.length>3&&/^[a-z ]+$/.test(t)){bd=d;best=p}}}
  return best&&bd<=2?{k:'sug',v:best[0],p:best[2]}:{k:'new',v:raw.trim()}}
function gender(n){var f=norm(n).split(' ')[0];return NAMES.m.indexOf(f)>-1?'m':NAMES.f.indexOf(f)>-1?'f':'u'}
function parse(text){return text.split(/\n/).map(function(l){return l.trim()}).filter(Boolean).map(function(l){var c=l.split(/\t|;|,/).map(function(x){return x.trim()});
  var r={name:c[0]||'',g:gender(c[0]||''),exp:c[4]||'',co:match('country',c[1]||''),ci:match('city',c[2]||''),ho:match('hospital',c[3]||''),raw:{co:c[1]||'',ci:c[2]||'',ho:c[3]||''}};
  if((r.co.k=='none'||r.co.k=='new')&&r.ci.p&&r.ci.k!='new'){r.co={k:'ok',v:r.ci.p,via:1}} return r})}
function input(){
  steps(1);var h='';
  if(mode=='paste')h='<textarea id="ta" rows="7" dir="auto" placeholder="Paste the table here"></textarea><p class="nt" style="margin:6px 0">Order: Name, Country, City, Hospital, Experience (years). Copy from Excel, a Google Form export or WhatsApp.</p><div class="row"><button class="pri" id="rd">Analyze</button><button id="sm">Fill with sample</button></div>';
  else{var lab={file:'Choose a CSV or Excel file',pdf:'Choose a PDF (selectable text is read exactly, no OCR)',photo:'Take or choose a photo of the typed table'};
    h='<div class="box"><div class="row" style="margin:0"><button id="pick">'+lab[mode]+'</button><input type="file" id="fl" style="display:none" '+(mode=='photo'?'accept="image/*" capture="environment"':'')+'><span class="nt" id="fn"></span></div><p class="nt" style="margin-top:8px">'+(mode=='photo'?'The photo is read with OCR. Typed sheets only; handwriting is not supported. ':'')+'This preview does not read your file, so the sample table is shown. In the real app you review the real result.</p></div><div class="row"><button class="pri" id="rd">Analyze</button></div>'}
  h+='<p class="er" id="ie" style="display:none"></p>';$('in').innerHTML=h;
  document.querySelectorAll('.tabs button').forEach(function(b){b.className=b.dataset.m==mode?'on':''})}
function chip(r,key,label){var x=r[key],cls='';
  if(x.k=='none')return '<span class="pl s-mut">Missing</span>';
  if(x.k=='ok')return '<span class="pl s-ok">'+esc(x.v)+(x.via?' (from city)':'')+'</span>';
  if(x.k=='sug')return '<span class="ch"><span class="pl s-warn">Same as '+esc(x.v)+'?</span><button data-y="'+key+'" data-i="'+rows.indexOf(r)+'">Yes</button><button data-n="'+key+'" data-i="'+rows.indexOf(r)+'">No</button></span>';
  return '<span class="pl s-acc">New: '+esc(x.v)+'</span>'}
function review(){
  var todo=0;rows.forEach(function(r){['co','ci','ho'].forEach(function(k){if(r[k].k=='sug')todo++});if(r.g=='u')todo++});
  var st={ok:0,sug:0,nw:0,gu:0};rows.forEach(function(r){['co','ci','ho'].forEach(function(k){var x=r[k].k;if(x=='ok')st.ok++;else if(x=='sug')st.sug++;else if(x=='new')st.nw++});if(r.g=='u')st.gu++});
  var h='<div class="cnt"><div class="c"><b>'+rows.length+'</b><span>Candidates</span></div><div class="c"><b>'+st.ok+'</b><span>Matched</span></div><div class="c"><b>'+st.sug+'</b><span>Same as…? to confirm</span></div><div class="c"><b>'+st.nw+'</b><span>New places</span></div><div class="c"><b>'+st.gu+'</b><span>Gender unknown</span></div></div><div class="rv'+(mode=='photo'?' ph':'')+'">'+(mode=='photo'?'<div class="photo">Original photo shown here, beside the rows. Uncertain cells are highlighted.</div>':'')+'<div class="tw"><table><thead><tr><th>Name</th><th>Gender</th><th>Country</th><th>City</th><th>Hospital</th><th>Years</th><th></th></tr></thead><tbody>';
  rows.forEach(function(r,i){
    h+='<tr><td><input dir="auto" data-nm="'+i+'" value="'+esc(r.name)+'"></td><td><select data-g="'+i+'" class="'+(r.g=='u'?'gq':'')+'"><option value="m"'+(r.g=='m'?' selected':'')+'>Male</option><option value="f"'+(r.g=='f'?' selected':'')+'>Female</option><option value="u"'+(r.g=='u'?' selected':'')+'>? Unknown</option></select></td>'
     +'<td class="cell">'+raw(r.raw.co)+''+chip(r,'co')+(r.co.v&&r.co.v!='Egypt'&&r.co.k!='sug'?' <span class="pl s-mut">Non-Egyptian</span>':'')+'</td>'
     +'<td class="cell">'+raw(r.raw.ci)+''+chip(r,'ci')+'</td><td class="cell">'+raw(r.raw.ho)+''+chip(r,'ho')+'</td>'
     +'<td><input class="exp" data-ex="'+i+'" value="'+esc(r.exp)+'" inputmode="numeric"></td><td><button data-rm="'+i+'" aria-label="Remove row">Remove</button></td></tr>'});
  h+='</tbody></table></div></div><div class="cn"><button class="pri" id="cf">Confirm and save '+rows.length+' candidates</button><button id="bk">Back</button>'+(todo?'<span class="pl s-warn">'+todo+' to review</span>':'<span class="pl s-ok">All matched</span>')+'</div><p class="er" id="ce" style="display:none"></p><p class="nt">A confirmed match is remembered, so the same spelling is never asked again.</p><p class="ok" id="cs" style="display:none"></p>';
  $('s2').innerHTML=h}
function go(){$('s1').style.display='none';$('s2').style.display='block';steps(2);review()}
$('in').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id=='sm'){$('ta').value=SAMPLE;return}
  if(b.id=='pick'){$('fl').click();return}
  if(b.id=='rd'){var t=mode=='paste'?$('ta').value:SAMPLE;if(!t.trim()){$('ie').textContent='Paste a table first.';$('ie').style.display='block';return}rows=parse(t);go()}});
$('in').addEventListener('change',function(e){if(e.target.id=='fl'&&e.target.files[0])$('fn').textContent=e.target.files[0].name});
document.querySelector('.tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b){mode=b.dataset.m;input()}});
$('s2').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.y){var r=rows[+b.dataset.i],k=b.dataset.y;r[k]={k:'ok',v:r[k].v,p:r[k].p};review();return}
  if(b.dataset.n){var r2=rows[+b.dataset.i],k2=b.dataset.n;r2[k2]={k:'new',v:r2.raw[k2]};review();return}
  if(b.dataset.rm){rows.splice(+b.dataset.rm,1);review();return}
  if(b.id=='bk'){$('s2').style.display='none';$('s1').style.display='block';steps(1);return}
  if(b.id=='cf'){var open=0;rows.forEach(function(r){['co','ci','ho'].forEach(function(k){if(r[k].k=='sug')open++});if(r.g=='u')open++});var ce=$('ce');
    if(open){ce.textContent='Resolve the '+open+' amber item'+(open>1?'s':'')+' first: confirm each match and set unknown genders.';ce.style.display='block';$('cs').style.display='none';return}
    ce.style.display='none';$('cs').innerHTML=rows.length+' candidates saved. <a class="btn" href="hands-on.html">Open the hands-on page</a>';$('cs').style.display='block';steps(3)}});
$('s2').addEventListener('change',function(e){var t=e.target;
  if(t.dataset.g){rows[+t.dataset.g].g=t.value;review()}
  if(t.dataset.nm)rows[+t.dataset.nm].name=t.value;if(t.dataset.ex)rows[+t.dataset.ex].exp=t.value});
input();
</script>
<script>if(!session.requireAuth()){};</script><script>
(async function(){
  var courses = await api('/api/courses').catch(function(){return {courses:[]};});
  var courseId = courses.courses && courses.courses.length ? courses.courses[0]._id : '';
  document.addEventListener('click', async function(e){
    var b = e.target.closest('#cf');
    if (!b) return;
    e.preventDefault(); e.stopPropagation();
    var items = (window.rows||[]).map(function(r){
      return { courseId: courseId, nameEn: r[0]||'', gender: 'u', countryId: r[2]||'', cityId: r[3]||'', hospitalId: r[4]||'', experienceYears: Number(r[5])||0, isEgyptian: /egypt/i.test(r[2]||'') };
    });
    try {
      await api('/api/candidates/bulk', { method:'POST', body: JSON.stringify({ items: items }) });
      var cs = document.getElementById('cs'); if (cs){ cs.textContent='Saved.'; cs.style.display='block'; }
    } catch(err){ var ce=document.getElementById('ce'); if(ce){ ce.textContent=err.message; ce.style.display='block'; } }
  }, true);
})();
</script>
<script>
// Gender lookup via backend (overrides design's local NAMES-based detection)
var _genderCache = {};
async function _resolveGender(name){
  var first = (name||'').trim().split(/\s+/)[0];
  if (!first) return 'u';
  if (_genderCache[first] !== undefined) return _genderCache[first];
  try { var r = await api('/api/names/gender?name='+encodeURIComponent(first)); _genderCache[first] = r.gender || 'u'; }
  catch(e){ _genderCache[first]='u'; }
  return _genderCache[first];
}
var _origGo = window.go;
window.go = async function(){
  // resolve genders for all rows first
  if (window.rows && window.rows.length) {
    for (var i=0;i<window.rows.length;i++){
      var r = window.rows[i];
      if (r && r[0]) { r._gender = await _resolveGender(r[0]); }
    }
  }
  if (typeof _origGo === 'function') _origGo();
};
// override gender() to use resolved cache
window.gender = function(n){ var first=(n||'').trim().split(/\s+/)[0]; return _genderCache[first] || 'u'; };
</script>

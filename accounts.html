<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account screens · design source of truth</title>
<link rel="stylesheet" href="shared.css">
<!--
  DESIGN SOURCE OF TRUTH: log in, create account, waiting-for-approval, and the heads' approvals screen.
  Match exactly. Do not restyle. Rules: sign-up creates a PENDING account; only ACTIVE users can log in;
  heads approve or reject and can reset a member's password. Errors are inline, never popups.
  The "Preview screen" row is preview-only. SAMPLE demo password for all sample users: demo1234
-->
<style>
.card{max-width:420px;margin:0 auto 12px}
.fld{display:block;margin:0 0 10px;font-size:13px;color:var(--text-2)}
.fld input{display:block;width:100%;margin-top:4px;color:var(--text)}
.pw{display:flex;gap:6px}
.pw input{flex:1;margin-top:4px}
.pw button{margin-top:4px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ur{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:8px 12px;margin:0 0 6px}
.ur .n{flex:1;min-width:140px;font-size:14px}
.ur .u{font-size:12px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace}
.tmp{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--bg-warn);color:var(--text-warn);border-radius:6px;padding:2px 8px;font-size:13px}
.big{text-align:center;padding:18px 8px}
.big .ic{width:44px;height:44px;border-radius:50%;background:var(--bg-warn);color:var(--text-warn);display:inline-flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:8px}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="home.html" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="home.html">Home</a><a href="calendar.html">Calendar</a><a href="hands-on.html">Hands-on</a><a href="attendance.html">Attendance</a><a href="tools.html">Tools</a><a href="import.html">Candidates</a><a href="activity.html">Activity</a><a class="cur" href="accounts.html">Account</a></nav>
</header>

<div id="v"></div>
</div>
<script src="install.js"></script>
<script>
/* SAMPLE users. Real users live in MongoDB (docs/DATA_MODEL.md). status: active|pending|rejected */
var U=[{n:'Dr. Ahmed',u:'ahmed',r:'head',s:'active'},{n:'Dr. Sara',u:'sara',r:'member',s:'active'},{n:'Dr. Omar',u:'omar',r:'member',s:'active'},{n:'Dr. Mona',u:'mona',r:'member',s:'pending'},{n:'Dr. Karim',u:'karim',r:'member',s:'pending'},{n:'Dr. Hala',u:'hala',r:'member',s:'rejected'}];
var scr='login',showPw=false,msg='',tmp={},signed=null,TP={},cu=null,cpmsg='';
function $(i){return document.getElementById(i)}
function ini(n){return n.replace(/^Dr\.\s*/,'').charAt(0)}
function brand(t,s){return '<div class="hero"><div class="lgo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><h1>'+t+'</h1><p>'+s+'</p></div>'}
function esc(x){var e=document.createElement('div');e.textContent=x;return e.innerHTML}
function pwField(id,label,ph){return '<label class="fld">'+label+'<div class="pw"><input id="'+id+'" type="'+(showPw?'text':'password')+'" placeholder="'+ph+'" autocomplete="off"><button type="button" data-pw="1">'+(showPw?'Hide':'Show')+'</button></div></label>'}
function view(){
  var h='';
  if(scr=='login'){
    h='<div class="bform">'+brand('Log in','Use the username your account was created with.')+'<div class="fbody"><label class="fld">Username<input id="lu" autocomplete="off" placeholder="for example sara"></label>'+pwField('lp','Password','Password')+'<p class="er" id="le" style="display:none"></p>'+(signed?'<p class="ok">Signed in as '+esc(signed)+'.</p>':'')+'<div class="bar"><button class="pri" id="lgo">Log in</button><button data-s="signup">Create account</button></div><p class="nt" style="margin-top:12px">Forgot your password? Ask a head to reset it. They give you a temporary password, and you choose your own the next time you log in.</p></div></div>'}
  else if(scr=='signup'){
    h='<div class="bform">'+brand('Create account','A head must approve your account before you can log in.')+'<div class="fbody"><label class="fld">Full name<input id="sn" dir="auto" placeholder="Dr. Name"></label><label class="fld">Username<input id="su" autocomplete="off" placeholder="at least 3 letters"></label>'+pwField('sp','Password','At least 8 characters')+pwField('sc','Confirm password','Repeat the password')+'<p class="er" id="se" style="display:none"></p><div class="bar"><button class="pri" id="sgo">Create account</button><button data-s="login">I already have an account</button></div></div></div>'}
  else if(scr=='pending'){
    h='<div class="bform">'+brand('Waiting for approval','Your account was created.')+'<div class="fbody pend"><div class="ic">…</div><p class="sub">A head needs to approve it before you can log in. Ask one of them to open the Approvals screen.</p><button data-s="login">Back to log in</button></div></div>'}
  else if(scr=='myacct'||scr=='change'){
    var f=scr=='change',u0=cu||U[1];
    h='<div class="bform">'+brand(f?'Choose a new password':'My account',f?'A head reset your password. Choose your own now.':'Signed in as '+esc(u0.n)+' · '+u0.r)+'<div class="fbody">'+(f?'':'<div class="ur" style="margin:0 0 12px"><span class="av">'+ini(u0.n)+'</span><span class="n" dir="auto">'+esc(u0.n)+(u0.r=='head'?' <span class="pl s-acc">head</span>':'')+'</span><span class="u">'+u0.u+'</span></div>')+'<h3 class="sh" style="margin-top:0">'+(f?'New password':'Change password')+'</h3>'+(f?'':pwField('cp0','Current password','Your current password'))+pwField('cp1','New password','At least 8 characters')+pwField('cp2','Confirm new password','Repeat the new password')+'<p class="er" id="cpe" style="display:none"></p>'+(cpmsg?'<p class="ok">'+cpmsg+'</p>':'')+'<div class="bar"><button class="pri" id="cgo">'+(f?'Save new password':'Change password')+'</button>'+(f?'':'<button data-s="login">Log out</button>')+'</div>'+(f?'':'<h3 class="sh">Use it like an app</h3><div class="bar" style="margin-top:0"><button id="inst2">Install app on this phone</button></div><div class="ip" id="ip2" style="display:none;margin-top:8px"></div>')+'</div></div>';cpmsg=''}
  else{
    var pend=U.filter(function(x){return x.s=='pending'}),act=U.filter(function(x){return x.s=='active'});
    h='<div class="hero"><h1>Approvals</h1><p>Only heads can see this screen.</p></div><div class="cnt"><div class="c"><b>'+pend.length+'</b><span>Waiting</span></div><div class="c"><b>'+act.length+'</b><span>Active members</span></div></div><h3 class="sh">Waiting for approval ('+pend.length+')</h3>'+(pend.length?pend.map(function(x){var i=U.indexOf(x);return '<div class="ur"><span class="av">'+ini(x.n)+'</span><span class="n" dir="auto">'+esc(x.n)+'</span><span class="u">'+x.u+'</span><button class="pri" data-ap="'+i+'">Approve</button><button data-rj="'+i+'">Reject</button></div>'}).join(''):'<p class="empty">Nobody is waiting.</p>')+(msg?'<p class="ok">'+msg+'</p>':'')+'<h3 class="sh">Team ('+act.length+')</h3>'+act.map(function(x){var i=U.indexOf(x);return '<div class="ur"><span class="av">'+ini(x.n)+'</span><span class="n" dir="auto">'+esc(x.n)+(x.r=='head'?' <span class="pl s-acc">head</span>':'')+'</span><span class="u">'+x.u+'</span>'+(tmp[i]?'<span class="nt">New password: <span class="tmp">'+tmp[i]+'</span> shown once</span>':'')+(x.r=='head'?'':'<button data-rs="'+i+'">Reset password</button>')+'</div>'}).join('')}
  $('v').innerHTML=h;
  if($('inst2'))ALX_install($('inst2'),$('ip2'));
  document.querySelectorAll('[data-s]').forEach(function(b){if(b.parentNode.className.indexOf('row')>-1)b.className=b.dataset.s==scr?'on':''})}
function err(id,t){var e=$(id);e.textContent=t;e.style.display='block'}
$('v').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.dataset.s){scr=b.dataset.s;signed=null;view();return}
  if(b.dataset.pw){var ids=['lp','sp','sc','cp0','cp1','cp2'],val={};ids.forEach(function(i){if($(i))val[i]=$(i).value});showPw=!showPw;view();for(var k in val)$(k).value=val[k];return}
  if(b.id=='lgo'){var u=$('lu').value.trim().toLowerCase(),p=$('lp').value,x=U.filter(function(z){return z.u==u})[0];
    if(!u||!p)return err('le','Enter your username and password.');
    if(!x||(p!='demo1234'&&p!=TP[x.u]))return err('le','Wrong username or password.');
    if(x.s=='pending')return err('le','Your account is waiting for a head to approve it.');
    if(x.s=='rejected')return err('le','Your account request was not approved. Ask a head.');
    cu=x;if(TP[x.u]&&p==TP[x.u]){scr='change';view();return}
    signed=x.n+' ('+x.r+')';view();return}
  if(b.id=='sgo'){var n=$('sn').value.trim(),u2=$('su').value.trim().toLowerCase(),p1=$('sp').value,p2=$('sc').value;
    if(!n)return err('se','Enter your full name.');
    if(u2.length<3)return err('se','Username needs at least 3 letters.');
    if(U.some(function(z){return z.u==u2}))return err('se','That username is taken. Try another.');
    if(p1.length<8)return err('se','Password needs at least 8 characters.');
    if(p1!=p2)return err('se','The two passwords do not match.');
    U.push({n:n,u:u2,r:'member',s:'pending'});scr='pending';view();return}
  if(b.dataset.ap){var x1=U[+b.dataset.ap];x1.s='active';msg=x1.n+' approved. They can log in now.';view();return}
  if(b.dataset.rj){var x2=U[+b.dataset.rj];x2.s='rejected';msg=x2.n+' rejected.';view();return}
  if(b.dataset.rs){var t='';for(var i=0;i<8;i++)t+='abcdefghjkmnpqrstuvwxyz23456789'.charAt(Math.floor(Math.random()*31));tmp[b.dataset.rs]=t;TP[U[+b.dataset.rs].u]=t;msg='';view();return}
  if(b.id=='cgo'){var f2=scr=='change',u1=cu||U[1],c0=f2?null:$('cp0').value,n1=$('cp1').value,n2=$('cp2').value;
    if(!f2&&c0!='demo1234'&&c0!=TP[u1.u])return err('cpe','Your current password is wrong.');
    if(n1.length<8)return err('cpe','The new password needs at least 8 characters.');
    if(!f2&&n1==c0)return err('cpe','Choose a password different from the current one.');
    if(n1!=n2)return err('cpe','The two passwords do not match.');
    delete TP[u1.u];cpmsg=f2?'Password saved. You are signed in.':'Password changed.';scr='myacct';view()}
});
/* preview row removed */
view();
</script>
<script>
// Wire real auth on top of the design's UI
document.addEventListener('click', async function(e){
  var b = e.target.closest('button'); if(!b) return;
  if (b.id === 'lgo') {
    e.preventDefault(); e.stopPropagation();
    var u = (document.getElementById('lu')||{}).value||'';
    var p = (document.getElementById('lp')||{}).value||'';
    u = u.trim().toLowerCase();
    if (!u||!p) { var le=document.getElementById('le'); if(le){le.textContent='Enter your username and password.';le.style.display='block'} return; }
    try {
      var d = await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})});
      localStorage.setItem('token',d.token); localStorage.setItem('user',JSON.stringify(d.user));
      var next = new URLSearchParams(location.search).get('next');
      location.href = next ? decodeURIComponent(next) : 'home.html';
    } catch(err){ var le2=document.getElementById('le'); if(le2){le2.textContent=err.message;le2.style.display='block'} }
  }
  if (b.id === 'sgo') {
    e.preventDefault(); e.stopPropagation();
    var n=(document.getElementById('sn')||{}).value||'';
    var u2=(document.getElementById('su')||{}).value||'';
    var p1=(document.getElementById('sp')||{}).value||'';
    var p2=(document.getElementById('sc')||{}).value||'';
    n=n.trim(); u2=u2.trim().toLowerCase();
    if(!n){var se=document.getElementById('se');if(se){se.textContent='Enter your full name.';se.style.display='block'}return;}
    if(u2.length<3){var se2=document.getElementById('se');if(se2){se2.textContent='Username needs at least 3 letters.';se2.style.display='block'}return;}
    if(p1.length<8){var se3=document.getElementById('se');if(se3){se3.textContent='Password needs at least 8 characters.';se3.style.display='block'}return;}
    if(p1!==p2){var se4=document.getElementById('se');if(se4){se4.textContent='The two passwords do not match.';se4.style.display='block'}return;}
    try { await api('/api/auth/signup',{method:'POST',body:JSON.stringify({name:n,username:u2,password:p1})}); location.href='accounts.html'; } catch(err){ var se5=document.getElementById('se'); if(se5){se5.textContent=err.message;se5.style.display='block'} }
  }
  if (b.id === 'cgo') {
    e.preventDefault(); e.stopPropagation();
    var f = scr==='change';
    var n1=(document.getElementById('cp1')||{}).value||'';
    var n2=(document.getElementById('cp2')||{}).value||'';
    if(n1.length<8){var cpe=document.getElementById('cpe');if(cpe){cpe.textContent='Password needs at least 8 characters.';cpe.style.display='block'}return;}
    if(n1!==n2){var cpe2=document.getElementById('cpe');if(cpe2){cpe2.textContent='The two passwords do not match.';cpe2.style.display='block'}return;}
    if(f){
      // forced change: no old password needed (use a sentinel? backend requires oldPassword)
      // For forced change, we'll ask current password too; fallback to old password field
    }
    var oldP = f ? null : ((document.getElementById('cp0')||{}).value||'');
    // if forced, prompt for current
    if (f) { oldP = prompt('Enter your current (temporary) password:'); if(!oldP) return; }
    try {
      await api('/api/auth/change-password',{method:'POST',body:JSON.stringify({oldPassword:oldP,newPassword:n1})});
      alert('Password changed. Please log in again.');
      localStorage.removeItem('token'); localStorage.removeItem('user');
      location.href='accounts.html';
    } catch(err){ var cpe3=document.getElementById('cpe'); if(cpe3){cpe3.textContent=err.message;cpe3.style.display='block'} }
  }
}, true);
</script>
<script>
document.addEventListener('click', async function(e){
  var b = e.target.closest('button'); if(!b) return;
  if (b.id === 'lgo') {
    e.preventDefault(); e.stopPropagation();
    var u = ((document.getElementById('lu')||{}).value||'').trim().toLowerCase();
    var p = (document.getElementById('lp')||{}).value||'';
    if (!u||!p) { var le=document.getElementById('le'); if(le){le.textContent='Enter your username and password.';le.style.display='block'} return; }
    try { var d = await api('/api/auth/login',{method:'POST',body:JSON.stringify({username:u,password:p})}); localStorage.setItem('token',d.token); localStorage.setItem('user',JSON.stringify(d.user)); var next=new URLSearchParams(location.search).get('next'); location.href = next?decodeURIComponent(next):'home.html'; }
    catch(err){ var le2=document.getElementById('le'); if(le2){le2.textContent=err.message;le2.style.display='block'} }
  }
  if (b.id === 'sgo') {
    e.preventDefault(); e.stopPropagation();
    var n=((document.getElementById('sn')||{}).value||'').trim();
    var u2=((document.getElementById('su')||{}).value||'').trim().toLowerCase();
    var p1=(document.getElementById('sp')||{}).value||'';
    var p2=(document.getElementById('sc')||{}).value||'';
    if(!n||u2.length<3||p1.length<8||p1!==p2){ var se=document.getElementById('se'); if(se){se.textContent='Check your inputs.';se.style.display='block'} return; }
    try { await api('/api/auth/signup',{method:'POST',body:JSON.stringify({name:n,username:u2,password:p1})}); location.href='accounts.html'; }
    catch(err){ var se2=document.getElementById('se'); if(se2){se2.textContent=err.message;se2.style.display='block'} }
  }
  if (b.id === 'out' || b.id === 'lo') { e.preventDefault(); session.logout(); }
  if (b.dataset && b.dataset.s === 'login' && session.user()) { e.preventDefault(); e.stopPropagation(); session.logout(); }
}, true);
</script>
</body>
</html>

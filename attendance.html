<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team attendance · ALEXEA Course Manager</title>
<link rel="stylesheet" href="shared.css">
<style>
.me{border-radius:14px;padding:14px 16px;margin:0 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.me .t{flex:1;min-width:200px;font-size:15px}
.me.go{background:var(--bg-accent);color:var(--text-accent)}
.me.wait{background:var(--bg-warn);color:var(--text-warn)}
.me.done{background:var(--bg-ok);color:var(--text-ok)}
.me.off{background:var(--surface-1);color:var(--text-2)}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.tb2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.mc{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:99px;padding:3px 12px 3px 4px;font-size:13px;color:var(--text)}
.mc:disabled{opacity:1;cursor:default}
.mc.on{outline:2px solid var(--text);background:var(--bg-accent)}
.gp{background:var(--surface-1);border:.5px solid var(--border);border-radius:16px;padding:12px 14px;margin:0 0 14px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-size:16px}
.avs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.tws{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.tws{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1100px){.tws{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tw{background:var(--surface-2);border:.5px solid var(--border);border-radius:14px;padding:8px 10px 6px}
.twh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2)}
.tp{font-size:11px;padding:1px 8px;border-radius:8px}
.t-d{background:var(--bg-aqua);color:var(--text-aqua)}
.t-w{background:var(--bg-orange);color:var(--text-orange)}
.t-a{background:var(--bg-violet);color:var(--text-violet)}
.mr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:8px 12px;margin:0 0 6px}
.mr .n{flex:1;min-width:130px;font-size:14px}
.mr .tm{font-size:12px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;min-width:48px}
.seg{display:inline-flex;border:.5px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.seg button+button{border-left:.5px solid var(--border-strong)}
.seg button.p.on{background:var(--bg-ok);color:var(--text-ok)}
.seg button.l.on{background:var(--bg-warn);color:var(--text-warn)}
.seg button.a.on{background:var(--bg-bad);color:var(--text-bad)}
.none{text-align:center;padding:24px 12px}
@media(prefers-color-scheme:dark){.tw svg{background:#E4E8E8;border-radius:10px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="/home" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="/home">Home</a><a href="/calendar">Calendar</a><a href="/hands-on">Hands-on</a><a class="cur" href="/attendance">Attendance</a><a href="/tools">Tools</a><a href="/candidates">Candidates</a><a href="/activity">Activity</a><a href="/account">Account</a></nav>
</header>
<div class="hero"><h1>Team attendance</h1><p id="sub"></p></div>
<div id="none" class="box none" style="display:none"></div>
<div id="main">
  <div class="me" id="me"></div>
  <div class="cnt" id="cnt"></div>
  <div id="warn"></div>
  <div class="box" id="pool"></div>
  <div id="groups"></div>
  <div class="box" id="list"></div>
</div>
</div>
<script src="install.js"></script>
<script src="station-sprite.js"></script>
<script>
var head = false, me = null, sel = null, day = null, course = null, users = [], att = {}, team = {};
var NM = { d: ['Dry', 't-d'], w: ['Wet', 't-w'], a: ['Animal', 't-a'] };
var LT = { d12: 'd', dw: 'w', da: 'a', sh: 'a' };
var LB = { present: ['Present', 's-ok'], late: ['Late', 's-warn'], absent: ['Absent', 's-bad'], '': ['Not checked in', 's-mut'] };
var TYPE = { d12: '12 dry stations', dw: '6 dry + 6 wet', da: '6 dry + 6 animal', sh: 'Shift day', none: 'No hands-on' };

function $(i) { return document.getElementById(i); }
function esc(x) { var e = document.createElement('div'); e.textContent = x == null ? '' : x; return e.innerHTML; }
function ini(n) { return (n || '?').replace(/^Dr\.\s*/i, '').charAt(0).toUpperCase(); }
function fdate(k) { var d = new Date(k + 'T00:00:00Z'); return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
function nowHM() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function startTime() { if (day && day.rows && day.rows.length) { var r = day.rows.slice().sort(function (a, b) { return String(a[0]).localeCompare(String(b[0])); }); return r[0][0]; } return '09:00'; }
function on(u) { var a = att[u.id]; return a && (a.state === 'present' || a.state === 'late'); }
function rec(u) { return att[u.id] || {}; }

/* ---------- render ---------- */
function render() {
  $('main').style.display = 'block';
  $('none').style.display = 'none';
  $('sub').innerHTML = '<span dir="auto">' + esc(course ? course.name : '') + '</span> · day ' + (day.index || 1) + ' · ' + fdate(day.date) + ' · starts ' + startTime();

  var my = me ? rec(me) : {};
  var cls, mm;
  if (!me) {
    cls = 'off'; mm = '<span class="t">Your account is not in the team list yet.</span>';
  } else if (my.state === 'absent') {
    cls = 'off'; mm = '<span class="t">You are marked absent today. Ask a head if this is wrong.</span>';
  } else if (!my.state) {
    cls = 'go'; mm = '<span class="t">Hi ' + esc(me.name) + '. Tap when you arrive. Checking in after ' + startTime() + ' counts as late.</span><button class="pri xl" id="here">I\'m here</button>';
  } else if (!team[me.id]) {
    cls = 'wait'; mm = '<span class="t"><span class="pulse"></span>Checked in at ' + esc(my.checkedInAt || '') + '. <b>Waiting for a head to assign you</b> to the Upper or Lower team.</span>';
  } else {
    cls = 'done'; mm = '<span class="t">You are in the <b>' + (team[me.id] === 'U' ? 'Upper team · stations 1–6' : 'Lower team · stations 7–12') + '</b>' + (day.type === 'none' ? '' : ' · ' + NM[team[me.id] === 'U' ? 'd' : LT[day.type]][0] + ' lab') + '.</span>';
  }
  $('me').className = 'me ' + cls;
  $('me').innerHTML = mm;

  var c = { p: 0, l: 0, a: 0, n: 0 };
  users.forEach(function (u) { var s = rec(u).state; if (!s) c.n++; else if (s === 'present') c.p++; else if (s === 'late') c.l++; else c.a++; });
  $('cnt').innerHTML = [['p', 'Present'], ['l', 'Late'], ['a', 'Absent'], ['n', 'Not checked in']].map(function (x) { return '<div class="c"><b>' + c[x[0]] + '</b><span>' + x[1] + '</span></div>'; }).join('');

  var onl = users.filter(on), hd = onl.filter(function (u) { return u.role === 'head'; }).length, w = '';
  if (!hd) w += '<p class="er">No head has checked in yet.</p>';
  if (onl.length && day.type !== 'none' && onl.every(function (u) { return team[u.id] !== 'U'; })) w += '<p class="er">Nobody is assigned to the Upper team yet.</p>';
  $('warn').innerHTML = w;

  var wait = onl.filter(function (u) { return !team[u.id]; });
  $('pool').innerHTML = '<div class="tb2"><b style="font-weight:500">Waiting for assignment (' + wait.length + ')</b>' + (head ? '<span style="flex:1"></span><button id="rnd">Randomize</button><button id="clr">Clear assignments</button>' : '') + '</div><div class="avs" style="margin:0">' + (wait.length ? wait.map(chip).join('') : '<span class="nt">Everyone on site is assigned.</span>') + '</div>' + (head ? '<p class="nt" style="margin-top:8px">Tap a name, then press Move here on a team. Tap two names to swap them. Suggested split: ' + Math.ceil(onl.length / 2) + ' Upper, ' + Math.floor(onl.length / 2) + ' Lower.</p>' : '');

  $('groups').innerHTML = day.type === 'none' ? '<div class="box"><p class="nt" style="margin:0">No hands-on today, so no Upper or Lower assignment is needed.</p></div>' : group('U') + group('L');

  $('list').innerHTML = '<h3 class="sh" style="margin-top:0">Check-in list</h3>' + users.map(function (u) {
    var s = rec(u).state || '';
    var ctl = head
      ? '<div class="seg"><button class="p' + (s === 'present' ? ' on' : '') + '" data-i="' + u.id + '" data-s="present">Present</button><button class="l' + (s === 'late' ? ' on' : '') + '" data-i="' + u.id + '" data-s="late">Late</button><button class="a' + (s === 'absent' ? ' on' : '') + '" data-i="' + u.id + '" data-s="absent">Absent</button></div>'
      : '<span class="pl ' + (LB[s] || LB[''])[1] + '">' + (LB[s] || LB[''])[0] + '</span>';
    return '<div class="mr"><span class="av' + (s === 'absent' ? ' off' : '') + '">' + ini(u.name) + '</span><span class="n" dir="auto">' + esc(u.name) + (u.role === 'head' ? ' <span class="pl s-acc">head</span>' : '') + '</span><span class="tm">' + esc(rec(u).checkedInAt || '') + '</span>' + ctl + '</div>';
  }).join('');
}
function chip(u) {
  var s = rec(u).state;
  return '<button class="mc' + (sel === u.id ? ' on' : '') + '" data-n="' + u.id + '"' + (head ? '' : ' disabled') + '><span class="av sm">' + ini(u.name) + '</span>' + esc(u.name) + (u.role === 'head' ? ' <span class="pl s-acc">head</span>' : '') + (s === 'late' ? ' <span class="pl s-warn">late</span>' : '') + '</button>';
}
function group(g) {
  var lab = g === 'U' ? 'Upper' : 'Lower', r = g === 'U' ? 1 : 7;
  var ty = g === 'U' ? 'd' : (LT[day.type] || 'a');
  var mem = users.filter(function (u) { return on(u) && team[u.id] === g; });
  var tw = '';
  for (var i = 0; i < 6; i++) tw += '<div class="tw"><div class="twh"><span>Station ' + (r + i) + '</span><span class="tp ' + NM[ty][1] + '">' + NM[ty][0] + '</span></div><svg viewBox="0 0 220 200" width="100%" role="img" aria-label="' + NM[ty][0] + ' lab station"><use href="#' + ty + '"/></svg></div>';
  var selName = sel ? (users.filter(function (u) { return u.id === sel; })[0] || {}).name : '';
  return '<div class="gp"><div class="gh"><div><b style="font-weight:500">' + lab + ' team</b> <span class="nt">stations ' + r + '–' + (r + 5) + ' · ' + NM[ty][0] + (day.type === 'sh' && g === 'L' ? ' first, groups swap halfway' : '') + '</span></div>' + (head && sel ? '<button data-mv="' + g + '">Move ' + esc(selName) + ' here</button>' : '') + '</div><div class="avs">' + (mem.length ? mem.map(chip).join('') : '<span class="nt">Nobody assigned yet</span>') + '</div><div class="tws">' + tw + '</div></div>';
}

/* ---------- persistence ---------- */
async function saveTeam() {
  try { await api('/api/courses/day/' + day._id, { method: 'PATCH', body: JSON.stringify({ team: team }) }); }
  catch (ex) { console.error(ex); }
}
async function load() {
  if (!session.requireAuth()) return;
  head = session.isHead();
  var u = session.user();
  try {
    var d = await api('/api/courses/active-day');
    if (!d || !d.day) return noCourse();
    day = d.day; course = d.course;
    team = day.team || {};
    var r = await api('/api/users'); users = r.users || [];
    me = users.filter(function (x) { return String(x.id) === String(u.id); })[0] || null;
    var a = await api('/api/attendance?courseDayId=' + day._id);
    att = {};
    (a.attendance || []).forEach(function (x) { att[x.userId] = x; });
    render();
  } catch (ex) {
    $('main').style.display = 'none';
    $('none').style.display = 'block';
    $('none').innerHTML = '<h3 class="sh" style="margin-top:0">Could not load today\'s course</h3><p class="nt">' + esc(ex.message) + '</p>';
  }
}
async function noCourse() {
  $('main').style.display = 'none';
  $('none').style.display = 'block';
  var today = new Date().toISOString().slice(0, 10);
  $('sub').textContent = fdate(today) + ' · no course today';
  var nx = '';
  try {
    var d = await api('/api/courses');
    var cs = (d.courses || []).filter(function (c) { return c.startDate > today; }).sort(function (a, b) { return a.startDate < b.startDate ? -1 : 1; });
    if (cs[0]) nx = 'Next course: <span dir="auto">' + esc(cs[0].name) + '</span> starts ' + fdate(cs[0].startDate) + '.';
  } catch (ex) {}
  $('none').innerHTML = '<h3 class="sh" style="margin-top:0">No course is running today</h3><p class="nt">' + nx + '</p><a class="btn" href="/calendar" style="margin-top:10px">Open the calendar</a>';
}

/* ---------- events ---------- */
$('main').addEventListener('click', async function (e) {
  var b = e.target.closest('button'); if (!b) return;

  if (b.id === 'here') {
    b.disabled = true;
    try {
      var r = await api('/api/attendance/checkin', { method: 'POST', body: JSON.stringify({ courseDayId: day._id, time: nowHM() }) });
      await load();
    } catch (ex) { alert(ex.message); b.disabled = false; }
    return;
  }

  if (b.dataset.n && head) {
    var id = b.dataset.n;
    if (sel === null) sel = id;
    else if (sel === id) sel = null;
    else {
      var gA = team[sel] || '', gB = team[id] || '';
      if (gA) team[sel] = gB; else delete team[sel];
      if (gB) team[id] = gA; else delete team[id];
      sel = null;
      await saveTeam();
    }
    render(); return;
  }

  if (b.dataset.mv && sel) {
    team[sel] = b.dataset.mv; sel = null;
    await saveTeam(); render(); return;
  }

  if (b.id === 'rnd') {
    var onl = users.filter(on);
    var hs = shuf(onl.filter(function (u) { return u.role === 'head'; }));
    var os = shuf(onl.filter(function (u) { return u.role !== 'head'; }));
    var all = hs.concat(os), f = Math.random() < .5;
    team = {};
    all.forEach(function (u, i) { team[u.id] = ((i % 2 === 0) === f) ? 'U' : 'L'; });
    sel = null;
    await saveTeam(); render(); return;
  }

  if (b.id === 'clr') {
    team = {}; sel = null;
    try { await api('/api/attendance/assignments?courseDayId=' + day._id, { method: 'DELETE' }); } catch (ex) { console.error(ex); }
    render(); return;
  }

  if (b.dataset.s && head) {
    var uid = b.dataset.i, state = b.dataset.s;
    var same = rec({ id: uid }).state === state;
    b.disabled = true;
    try {
      await api('/api/attendance', { method: 'POST', body: JSON.stringify({ courseDayId: day._id, userId: uid, state: same ? 'absent' : state, checkedInAt: same ? '' : nowHM() }) });
      if (same) delete team[uid];
      await load();
    } catch (ex) { alert(ex.message); b.disabled = false; }
    return;
  }
});

function shuf(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

load();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team attendance · design source of truth</title>
<link rel="stylesheet" href="shared.css">
<!--
  DESIGN SOURCE OF TRUTH: team attendance and Upper/Lower assignment. Match exactly. Do not restyle.
  FLOW: the app knows today's date, so it finds today's course and day from the calendar (no course picker).
  1) A member taps "I'm here" -> checked in, status "Waiting for assignment".
  2) A head assigns each checked-in person to the Upper team (stations 1-6, always dry) or the Lower team
     (stations 7-12: dry, wet or animal, from that day's hands-on type in the course programme).
     Heads can tap two names to swap them, move a selected name to a team, or press Randomize.
  3) The member then sees "You are in the Upper team".
  Check-in after the start time = late. Absent people cannot be assigned. Needs courses-2026.js and station-sprite.js.
  "View as", "Signed in as", "Preview date" and "Preview clock" are preview-only controls.
-->
<style>
.pv{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 12px;font-size:12px;color:var(--text-2)}
.pv select{padding:4px 8px}
.me{border-radius:14px;padding:14px 16px;margin:0 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.me .t{flex:1;min-width:200px;font-size:15px}
.me.go{background:var(--bg-accent);color:var(--text-accent)}
.me.wait{background:var(--bg-warn);color:var(--text-warn)}
.me.done{background:var(--bg-ok);color:var(--text-ok)}
.me.off{background:var(--surface-1);color:var(--text-2)}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:currentColor;margin-right:8px;animation:pl 1.4s infinite}
@keyframes pl{50%{opacity:.25}}
.tb2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:0 0 8px}
.mc{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:.5px solid var(--border-strong);border-radius:99px;padding:3px 12px 3px 4px;font-size:13px;color:var(--text)}
.mc:disabled{opacity:1;cursor:default}
.mc.on{outline:2px solid var(--text);background:var(--bg-accent)}
.gp{background:var(--surface-1);border:.5px solid var(--border);border-radius:16px;padding:12px 14px;margin:0 0 14px}
.gh{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin:0 0 8px;font-size:16px}
.avs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.tws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(max-width:640px){.tws{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:420px){.tws{grid-template-columns:minmax(0,1fr)}}
@media(min-width:1100px){.tws{grid-template-columns:repeat(6,minmax(0,1fr))}}
.tw{background:var(--surface-2);border:.5px solid var(--border);border-radius:14px;padding:8px 10px 6px}
.twh{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--text-2)}
.tp{font-size:11px;padding:1px 8px;border-radius:8px}
.t-d{background:var(--bg-aqua);color:var(--text-aqua)}
.t-w{background:var(--bg-orange);color:var(--text-orange)}
.t-a{background:var(--bg-violet);color:var(--text-violet)}
.mr{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface-2);border-radius:10px;padding:8px 12px;margin:0 0 6px}
.mr .n{flex:1;min-width:130px;font-size:14px}
.mr .tm{font-size:12px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;min-width:48px}
.seg{display:inline-flex;border:.5px solid var(--border-strong);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 12px;font-size:13px}
.seg button+button{border-left:.5px solid var(--border-strong)}
.seg button.p.on{background:var(--bg-ok);color:var(--text-ok)}
.seg button.l.on{background:var(--bg-warn);color:var(--text-warn)}
.seg button.a.on{background:var(--bg-bad);color:var(--text-bad)}
.none{text-align:center;padding:24px 12px}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="home.html" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="home.html">Home</a><a href="calendar.html">Calendar</a><a href="hands-on.html">Hands-on</a><a class="cur" href="attendance.html">Attendance</a><a href="tools.html">Tools</a><a href="import.html">Candidates</a><a href="activity.html">Activity</a><a href="accounts.html">Account</a></nav>
</header>
<div class="hero"><h1>Team attendance</h1><p id="sub"></p></div>
<div class="pv"><span>Preview only:</span>
  <button id="rh">Head</button><button id="ri">Member</button>
  Signed in as <select id="who"></select>
  Date <select id="pd"><option value="2026-11-06">Fri 6 Nov (no course)</option><option value="2026-11-08">Sun 8 Nov (day 1)</option><option value="2026-11-09" selected>Mon 9 Nov (day 2)</option><option value="2026-11-10">Tue 10 Nov (day 3, shift)</option><option value="2026-11-11">Wed 11 Nov (day 4, live surgery)</option></select>
  Clock <select id="clk"><option value="08:45">08:45</option><option value="09:12" selected>09:12</option></select>
</div>
<div id="none" class="box none" style="display:none"></div>
<div id="main">
  <div class="me" id="me"></div>
  <div class="cnt" id="cnt"></div>
  <div id="warn"></div>
  <div class="box" id="pool"></div>
  <div id="groups"></div>
  <div class="box" id="list"></div>
</div>
</div>
<script src="courses-2026.js"></script>
<script src="station-sprite.js"></script>
<script>
/* SAMPLE state. In the real app this comes from the API for today's course day. */
var START='09:00',head=true,me=2,sel=null,PD='2026-11-09',M=[];
var NM={d:['Dry','t-d'],w:['Wet','t-w'],a:['Animal','t-a']},LT={d12:'d',dw:'w',da:'a',sh:'a'};
var LB={p:['Present','s-ok'],l:['Late','s-warn'],a:['Absent','s-bad'],'':['Not checked in','s-mut']};
function $(i){return document.getElementById(i)}
function ini(n){return n.replace(/^Dr\.\s*/,'').charAt(0)}
function days(a,b){var r=[],d=new Date(a+'T00:00:00Z'),e=new Date(b+'T00:00:00Z');while(d<=e){r.push(d.toISOString().slice(0,10));d=new Date(d.getTime()+864e5)}return r}
function fdate(k){var d=new Date(k+'T00:00:00Z');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()]+' '+d.getUTCFullYear()}
function ht(i,n){if(n==1)return 'none';if(i==1)return 'd12';if(i==n&&n>2)return 'none';if(i==2)return 'dw';if(i==3)return 'sh';return 'da'}
function info(k){for(var i=0;i<CS.length;i++){var c=CS[i];if(k>=c[2]&&k<=c[3]){var ds=days(c[2],c[3]),ix=ds.indexOf(k)+1;return {c:c,i:ix,n:ds.length,t:ht(ix,ds.length)}}}return null}
function init(){M=[{n:'Dr. Ahmed',h:1,s:'p',t:'08:48',g:''},{n:'Dr. Hany',h:1,s:'p',t:'08:55',g:''},{n:'Dr. Sara',h:0,s:'',t:'',g:''},{n:'Dr. Omar',h:0,s:'l',t:'09:12',g:''},{n:'Dr. Nour',h:0,s:'p',t:'08:50',g:''},{n:'Dr. Mona',h:0,s:'a',t:'',g:''},{n:'Dr. Youssef',h:0,s:'p',t:'08:58',g:''},{n:'Dr. Karim',h:0,s:'',t:'',g:''}];sel=null}
function on(m){return m.s=='p'||m.s=='l'}
function chip(m){return '<button class="mc'+(sel==m.n?' on':'')+'" data-n="'+m.n+'"'+(head?'':' disabled')+'><span class="av sm">'+ini(m.n)+'</span>'+m.n+(m.h?' <span class="pl s-acc">head</span>':'')+(m.s=='l'?' <span class="pl s-warn">late</span>':'')+'</button>'}
function group(g,I){
  var lab=g=='U'?'Upper':'Lower',r=g=='U'?1:7,ty=g=='U'?'d':LT[I.t],mem=M.filter(function(m){return on(m)&&m.g==g}),tw='';
  for(var i=0;i<6;i++)tw+='<div class="tw"><div class="twh"><span>Station '+(r+i)+'</span><span class="tp '+NM[ty][1]+'">'+NM[ty][0]+'</span></div><svg viewBox="0 0 220 200" width="100%" role="img" aria-label="'+NM[ty][0]+' lab station"><use href="#'+ty+'"/></svg></div>';
  return '<div class="gp"><div class="gh"><div><b style="font-weight:500">'+lab+' team</b> <span class="nt">stations '+r+'–'+(r+5)+' · '+NM[ty][0]+(I.t=='sh'&&g=='L'?' first, groups swap halfway':'')+'</span></div>'+(head&&sel?'<button data-mv="'+g+'">Move '+sel+' here</button>':'')+'</div><div class="avs">'+(mem.length?mem.map(chip).join(''):'<span class="nt">Nobody assigned yet</span>')+'</div><div class="tws">'+tw+'</div></div>'}
function render(){
  var I=info(PD);
  $('who').innerHTML=M.map(function(m,i){return '<option value="'+i+'"'+(i==me?' selected':'')+'>'+m.n+'</option>'}).join('');
  $('rh').className=head?'on':'';$('ri').className=head?'':'on';
  if(!I){var nx=null;CS.forEach(function(c){if(c[2]>PD&&(!nx||c[2]<nx[2]))nx=c});
    $('sub').textContent=fdate(PD)+' · no course today';$('none').style.display='block';$('main').style.display='none';
    $('none').innerHTML='<h3 class="sh" style="margin-top:0">No course is running today</h3><p class="nt">'+(nx?'Next course: <span dir="auto">'+nx[1]+'</span> starts '+fdate(nx[2])+'.':'')+'</p><a class="btn" href="calendar.html" style="margin-top:10px">Open the calendar</a>';return}
  $('none').style.display='none';$('main').style.display='block';
  $('sub').innerHTML='<span dir="auto">'+I.c[1]+'</span> · day '+I.i+' of '+I.n+' · '+fdate(PD)+' · starts '+START;
  var m=M[me],mm,cls;
  if(m.s=='a'){cls='off';mm='<span class="t">You are marked absent today. Ask a head if this is wrong.</span>'}
  else if(m.s==''){cls='go';mm='<span class="t">Hi '+m.n+'. Tap when you arrive. Checking in after '+START+' counts as late.</span><button class="pri xl" id="here">I\'m here</button>'}
  else if(m.g==''){cls='wait';mm='<span class="t"><span class="pulse"></span>Checked in at '+m.t+'. <b>Waiting for a head to assign you</b> to the Upper or Lower team.</span>'}
  else{cls='done';mm='<span class="t">You are in the <b>'+(m.g=='U'?'Upper team · stations 1–6':'Lower team · stations 7–12')+'</b>'+(I.t=='none'?'':' · '+NM[m.g=='U'?'d':LT[I.t]][0]+' lab')+'.</span>'}
  $('me').className='me '+cls;$('me').innerHTML=mm;
  var c={p:0,l:0,a:0,n:0};M.forEach(function(x){if(x.s=='')c.n++;else c[x.s]++});
  $('cnt').innerHTML=[['p','Present'],['l','Late'],['a','Absent'],['n','Not checked in']].map(function(x){return '<div class="c"><b>'+c[x[0]]+'</b><span>'+x[1]+'</span></div>'}).join('');
  var onl=M.filter(on),hd=onl.filter(function(x){return x.h}).length,w='';
  if(hd==0)w+='<p class="er">No head has checked in yet.</p>';
  if(onl.length&&onl.every(function(x){return x.g!='U'})&&I.t!='none')w+='<p class="er">Nobody is assigned to the Upper team yet.</p>';
  $('warn').innerHTML=w;
  var wait=onl.filter(function(x){return x.g==''});
  $('pool').innerHTML='<div class="tb2"><b style="font-weight:500">Waiting for assignment ('+wait.length+')</b>'+(head?'<span style="flex:1"></span><button id="rnd">Randomize</button><button id="clr">Clear assignments</button>':'')+'</div><div class="avs" style="margin:0">'+(wait.length?wait.map(chip).join(''):'<span class="nt">Everyone on site is assigned.</span>')+'</div>'+(head?'<p class="nt" style="margin-top:8px">Tap a name, then press Move here on a team. Tap two names to swap them. Suggested split: '+Math.ceil(onl.length/2)+' Upper, '+Math.floor(onl.length/2)+' Lower.</p>':'');
  $('groups').innerHTML=I.t=='none'?'<div class="box"><p class="nt" style="margin:0">No hands-on today, so no Upper or Lower assignment is needed.</p></div>':group('U',I)+group('L',I);
  $('list').innerHTML='<h3 class="sh" style="margin-top:0">Check-in list</h3>'+M.map(function(x,i){
    var ctl=head?'<div class="seg"><button class="p'+(x.s=='p'?' on':'')+'" data-i="'+i+'" data-s="p">Present</button><button class="l'+(x.s=='l'?' on':'')+'" data-i="'+i+'" data-s="l">Late</button><button class="a'+(x.s=='a'?' on':'')+'" data-i="'+i+'" data-s="a">Absent</button></div>':'<span class="pl '+LB[x.s][1]+'">'+LB[x.s][0]+'</span>';
    return '<div class="mr"><span class="av'+(x.s=='a'?' off':'')+'">'+ini(x.n)+'</span><span class="n">'+x.n+(x.h?' <span class="pl s-acc">head</span>':'')+'</span><span class="tm">'+(x.t||'')+'</span>'+ctl+'</div>'}).join('')}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
$('main').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
  if(b.id=='here'){var m=M[me],t=$('clk').value;m.t=t;m.s=t>START?'l':'p';render();return}
  if(b.dataset.n&&head){var n=b.dataset.n;if(sel==null)sel=n;else if(sel==n)sel=null;else{var A=M.filter(function(x){return x.n==sel})[0],B=M.filter(function(x){return x.n==n})[0],g=A.g;A.g=B.g;B.g=g;sel=null}render();return}
  if(b.dataset.mv&&sel){M.filter(function(x){return x.n==sel})[0].g=b.dataset.mv;sel=null;render();return}
  if(b.id=='rnd'){var o=M.filter(on),hs=shuf(o.filter(function(x){return x.h})),os=shuf(o.filter(function(x){return !x.h})),a=hs.concat(os),f=Math.random()<.5;a.forEach(function(x,i){x.g=((i%2==0)==f)?'U':'L'});sel=null;render();return}
  if(b.id=='clr'){M.forEach(function(x){x.g=''});sel=null;render();return}
  if(b.dataset.s){var x2=M[+b.dataset.i];x2.s=x2.s==b.dataset.s?'':b.dataset.s;if(x2.s=='p'||x2.s=='l'){if(!x2.t)x2.t=$('clk').value}else{x2.g='';if(x2.s=='')x2.t=''}render()}});
$('who').onchange=function(e){me=+e.target.value;render()};
$('pd').onchange=function(e){PD=e.target.value;init();render()};
$('rh').onclick=function(){head=true;sel=null;render()};$('ri').onclick=function(){head=false;sel=null;render()};
init();render();
</script>
<script>
(async function(){
  try {
    var cd = await api('/api/courses/current-day');
    if (!cd.day) { document.getElementById('body') && (document.getElementById('body').innerHTML='<p class="empty">No course today.</p>'); return; }
    var day = cd.day;
    var users = await api('/api/users');
    var att = await api('/api/attendance?courseDayId='+day._id);
    var attMap = {}; (att.attendance||[]).forEach(function(a){ attMap[a.userId]=a; });
    // override M
    M = (users.users||[]).map(function(u){
      var a = attMap[u.id];
      return { n: u.name, h: u.role==='head'?1:0, s: a ? a.state.charAt(0) : '', t: a ? (a.checkedInAt||'') : '', g: '', id: u.id };
    });
    var cu = session.user();
    if (cu) { var mi = M.findIndex(function(m){return m.n===cu.name}); if (mi>=0) me = mi; }
    START = (day.rows&&day.rows.length)? day.rows[0].start : '09:00';
    // override course info
    var sub = document.getElementById('sub');
    if (sub && cd.course) sub.textContent = cd.course.name + ' · day ' + day.index + ' · ' + day.date + ' · starts at ' + START;
    // team assignments from day.team
    M.forEach(function(m, idx){ /* map by name not id; skip team for now */ });
    if (typeof render === 'function') render();
  } catch(e){ console.error('attendance load failed', e); }
})();
</script>
</body>
</html>

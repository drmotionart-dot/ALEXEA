<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team activity · ALEXEA Course Manager</title>
<link rel="stylesheet" href="shared.css">
<!--
  Team activity (heads only). One page where heads see what everyone did in the app:
  check-ins, team assignments and swaps, tool status changes and repair reports, candidate imports,
  account requests and approvals, programme changes. Newest first, grouped by day, with filters.
  Members who open this page see a "Only heads can see this page" message (the server enforces it too).
  Every entry comes from the server activity collection. Heads can clear the log.
-->
<style>
.fl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 12px}
.dh{font-size:13px;font-weight:500;margin:16px 0 6px;color:var(--text-2)}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--surface-1);border:.5px solid var(--border);border-radius:12px;padding:10px 12px;margin:0 0 6px;text-decoration:none;color:inherit}
a.ev:hover{border-color:var(--border-stronger)}
.ev .tx{flex:1;min-width:0;font-size:14px}
.ev .tx b{font-weight:500}
.ev .tm{font-size:12px;color:var(--text-2);font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.ic2{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.k-checkin{background:var(--bg-ok);color:var(--text-ok)}
.k-assign{background:var(--bg-accent);color:var(--text-accent)}
.k-tool{background:var(--bg-orange);color:var(--text-orange)}
.k-repair{background:var(--bg-bad);color:var(--text-bad)}
.k-cand{background:var(--bg-violet);color:var(--text-violet)}
.k-acct{background:var(--bg-warn);color:var(--text-warn)}
.k-cal{background:var(--bg-aqua);color:var(--text-aqua)}
.none{text-align:center;padding:24px 12px}
.spacer{flex:1}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="/icon-192.png">
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">
<header class="top">
  <a class="hl" href="/home" aria-label="Home"><div class="logo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div><span class="brand">ALEXEA Course Manager</span></a>
  <nav class="nav"><a href="/home">Home</a><a href="/calendar">Calendar</a><a href="/hands-on">Hands-on</a><a href="/attendance">Attendance</a><a href="/tools">Tools</a><a href="/candidates">Candidates</a><a class="cur" href="/activity">Activity</a><a href="/account">Account</a></nav>
</header>
<div class="hero"><h1>Team activity</h1><p>Everything the team did in the app, newest first. Only heads can see this page.</p></div>

<div id="body"></div>
</div>
<script src="install.js"></script>
<script>
var E=[],kind='all',who='all',shown=10,msg='';
var KS=[['all','All'],['checkin','Check-ins'],['assign','Assignments'],['tool','Tools'],['cand','Candidates'],['acct','Accounts'],['cal','Calendar']];
var IC={checkin:'✓',assign:'⇄',tool:'⚙',repair:'!',cand:'☰',acct:'☺',cal:'▦'};

function $(i){return document.getElementById(i)}
function esc(x){var e=document.createElement('div');e.textContent=x==null?'':x;return e.innerHTML}
function todayKey(){return new Date().toISOString().slice(0,10)}
function fd(k){
  var t=todayKey(),y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  if(k===t)return 'Today';
  if(k===y)return 'Yesterday';
  var d=new Date(k+'T00:00:00Z');
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getUTCDay()]+' '+d.getUTCDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getUTCMonth()];
}
function href(l){if(!l)return '/activity';if(/^https?:\/\//.test(l))return l;return l.charAt(0)==='/'?'/'+l.replace(/^\/+/,'').replace(/^api\//,'api/'):'/'+l}
function match(e){var k=e.kind==='repair'?'tool':e.kind;return (kind==='all'||k===kind)&&(who==='all'||e.by===who)}
function render(){
  if(!session.isHead()){
    $('body').innerHTML='<div class="box none"><h3 class="sh" style="margin-top:0">Only heads can see this page</h3><p class="nt">Ask a head if you need to know what happened.</p><a class="btn" href="/home" style="margin-top:10px">Back to Home</a></div>';
    return;
  }
  var people=[];
  E.forEach(function(e){if(people.indexOf(e.by)<0)people.push(e.by)});
  var t=todayKey();
  var td=E.filter(function(e){return e.date===t}).length;
  var rp=E.filter(function(e){return e.kind==='repair'}).length;
  var ck=E.filter(function(e){return e.date===t&&e.kind==='checkin'}).length;
  var h='<div class="cnt"><div class="c"><b>'+td+'</b><span>Actions today</span></div><div class="c"><b>'+rp+'</b><span>Repair reports</span></div><div class="c"><b>'+ck+'</b><span>Check-ins today</span></div></div>';
  h+='<div class="fl">'+KS.map(function(k){return '<button data-k="'+k[0]+'" class="'+(kind===k[0]?'on':'')+'">'+k[1]+'</button>'}).join('')
    +'<select id="wh" aria-label="Person"><option value="all">Everyone</option>'+people.map(function(p){return '<option'+(who===p?' selected':'')+'>'+esc(p)+'</option>'}).join('')+'</select>'
    +'<span class="spacer"></span><button id="clear">Clear activity</button></div>';
  if(msg)h+='<p class="ok">'+esc(msg)+'</p>';
  var L=E.filter(match),vis=L.slice(0,shown),last='';
  vis.forEach(function(e){
    if(e.date!==last){h+='<p class="dh">'+fd(e.date)+'</p>';last=e.date}
    h+='<a class="ev" href="'+href(e.link)+'"><span class="ic2 k-'+esc(e.kind)+'">'+(IC[e.kind]||'•')+'</span><span class="tx"><b>'+esc(e.by)+'</b> '+(e.text||'')+'</span><span class="tm">'+esc(e.time||'')+'</span></a>';
  });
  if(!L.length)h+='<p class="empty">'+(E.length?'Nothing matches these filters.':'Nothing recorded yet. Actions appear here as the team uses the app.')+'</p>';
  if(L.length>shown)h+='<div class="row" style="margin-top:10px"><button id="more">Show more ('+(L.length-shown)+')</button></div>';
  $('body').innerHTML=h;
}
async function load(){
  try{
    var d=await api('/api/activity');
    E=d.entries||[];
  }catch(ex){E=[];msg=ex.message}
  render();
}
$('body').addEventListener('click',async function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.dataset.k){kind=b.dataset.k;shown=10;render();return}
  if(b.id==='more'){shown+=10;render();return}
  if(b.id==='clear'){
    if(!confirm('Clear the whole activity log? This cannot be undone.'))return;
    b.disabled=true;
    try{
      await api('/api/activity',{method:'DELETE'});
      E=[];msg='Activity cleared.';kind='all';who='all';shown=10;render();
    }catch(ex){msg=ex.message;render()}
    return;
  }
});
$('body').addEventListener('change',function(e){
  if(e.target.id==='wh'){who=e.target.value;shown=10;render()}
});
(async function(){
  if(!session.requireAuth())return;
  render();
  await load();
})();
</script>
</body>
</html>

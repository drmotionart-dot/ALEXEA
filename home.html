<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · ALEXEA</title>
<link rel="stylesheet" href="shared.css">
<link rel="stylesheet" href="topbar.css">
<style>
.hero{min-height:150px}
.hero .lgo{width:64px;height:64px;border-radius:14px}
.hero h1{font-size:24px}
.hu{position:absolute;top:14px;right:14px;z-index:2;display:flex;gap:8px;align-items:center;max-width:none!important}
.hu .who{font-size:13px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px}
.hg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media(max-width:900px){.hg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.hg{grid-template-columns:minmax(0,1fr)}.hu{position:static;margin-bottom:8px}}
.hc{position:relative;display:flex;flex-direction:column;background:var(--surface-1);border:.5px solid var(--border);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.hc:hover{transform:translateY(-3px);border-color:var(--border-stronger)}
.hc:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
.hi{background:var(--surface-2);height:128px;display:flex;align-items:center;justify-content:center;padding:10px;border-bottom:.5px solid var(--border)}
.hi svg{max-height:100%;width:auto;max-width:100%}
.hb{padding:12px 14px 14px}
.hb .t{font-size:17px;font-weight:500;margin:0 0 2px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.hb .t span.ar{font-size:18px;color:var(--text-2)}
.hb .s{font-size:13px;color:var(--text-2);margin:0}
.bd{position:absolute;top:10px;right:10px;font-size:12px;font-weight:500;padding:2px 10px;border-radius:99px}
.ft{font-size:12px;color:var(--text-2);text-align:center;margin:16px 0 0}
</style>
</head>
<body>
<div class="wrap">
<div class="hero">
  <div class="hu"><span class="who" id="who"></span><button id="out">Log out</button></div>
  <div class="lgo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div>
  <h1 id="hi">Welcome</h1>
  <p>ALEXEA Course Manager</p>
</div>
<div class="hg" id="hg"></div>
<p class="ft">Tap a card to open that page. Use the logo or Home in the top bar to come back.</p>
</div>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/session.js"></script>
<script src="tool-drawings.js"></script>
<script>
var head=session.isHead();
function ini(n){return (n||'?').replace(/^Dr\.\s*/i,'').charAt(0).toUpperCase()}
function cards(S){
  var c=[
   {h:'calendar.html',t:'Calendar',s:S.cal||'Course calendar',a:'<svg viewBox="0 0 200 110" width="200" height="110"><rect x="30" y="6" width="140" height="98" rx="10" fill="#fff" stroke="#C9CDCC"/><rect x="30" y="6" width="140" height="22" rx="10" fill="#1B8FA0"/></svg>'},
   {h:'hands-on.html',t:'Hands-on',s:S.hands||'Station planning',a:'<svg viewBox="0 0 220 110" width="220" height="110"><rect x="16" y="14" width="40" height="26" rx="3" fill="#1E2527"/></svg>'},
   {h:'attendance.html',t:'Attendance',s:S.att||'Team check-in',a:'<svg viewBox="0 0 200 110" width="200" height="110"><circle cx="50" cy="55" r="28" fill="#DCE9F8"/></svg>'},
   {h:'tools.html',t:'Tools',s:S.tools||'Inventory',a:'<div class="tl">'+(window.toolSvg?window.toolSvg('grasper'):'')+'</div>',b:S.rep?'need repair':'',bc:'s-bad'},
   {h:'import.html',t:'Candidates',s:S.cand||'Import candidates',a:'<svg viewBox="0 0 200 110" width="200" height="110"><rect x="16" y="10" width="168" height="92" rx="10" fill="#fff" stroke="#C9CDCC"/></svg>',b:S.rev?'to review':'',bc:'s-warn'},
  ];
  if(head)c.push({h:'accounts.html',t:'Approvals',s:'Accounts waiting',a:'<svg viewBox="0 0 200 110" width="200" height="110"><path d="M100 8L146 24V54C146 78 126 96 100 104C74 96 54 78 54 54V24Z" fill="#DCE9F8" stroke="#0A5CA8" stroke-width="3"/></svg>',b:S.pend?'waiting':'',bc:'s-warn'});
  else c.push({h:'accounts.html',t:'My account',s:(session.user()&&session.user().name)||'Account',a:'<svg viewBox="0 0 200 110" width="200" height="110"><path d="M100 8L146 24V54C146 78 126 96 100 104C74 96 54 78 54 54V24Z" fill="#DCE9F8" stroke="#0A5CA8" stroke-width="3"/></svg>'});
  document.getElementById('hg').innerHTML=c.map(function(x){
    return '<a class="hc" href="'+x.h+'"><div class="hi">'+x.a+'</div>'+(x.b?'<span class="bd pl '+x.bc+'">'+x.b+'</span>':'')+'<div class="hb"><p class="t">'+x.t+'<span class="ar" aria-hidden="true">›</span></p><p class="s">'+x.s+'</p></div></a>'}).join('');
  document.getElementById('who').textContent=session.user()?session.user().name+' · '+session.user().role:'guest';
  document.getElementById('hi').textContent='Welcome, '+(session.user()?session.user().name:'guest');
}
async function load(){
  var S={cal:'Course calendar',hands:'Station planning',att:'Team check-in',tools:'Inventory',cand:'Import candidates'};
  try{
    var courses=await api('/api/courses'); S.cal='Next: '+(courses.courses&&courses.courses[0]?courses.courses[0].name:'none');
    var tools=await api('/api/tools'); S.tools=(tools.tools||[]).length+' units';
    var rc=await api('/api/tools/repair-count'); S.rep=rc.count||0;
    var cands=await api('/api/candidates'); S.cand=(cands.candidates||[]).length+' candidates';
  }catch(e){}
  cards(S);
}
if(!session.requireAuth()){}
else load();
document.getElementById('out').onclick=session.logout;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · design source of truth</title>
<link rel="stylesheet" href="shared.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<!--
  DESIGN SOURCE OF TRUTH: Home page (route "/"). Match exactly. Do not restyle.
  No top bar here. Big cards, each opens one main page. Every card picture is built from the app's own drawings:
  the three station towers (station-sprite.js), the real instruments (tool-drawings.js), a November calendar
  that uses the department colors, avatars, and the Arabic/English candidate table.
  Summaries are LIVE in the real app (numbers below are SAMPLE). "View as" is preview-only.
  "Install app" shows the real install prompt on Android and the Add to Home Screen steps on iPhone.
-->
<style>
.hero{min-height:150px}
.hero .lgo{width:64px;height:64px;border-radius:14px}
.hero h1{font-size:24px}
.hu{position:absolute;top:14px;right:14px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:none!important}
.hu .who{font-size:13px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px}
.ip{background:var(--bg-accent);color:var(--text-accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;display:none}
.hg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.hg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.hg{grid-template-columns:minmax(0,1fr)}.hu{position:static;margin-bottom:8px;justify-content:flex-start}}
.hc{position:relative;display:flex;flex-direction:column;background:var(--surface-1);border:.5px solid var(--border);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .14s,box-shadow .14s,border-color .14s}
.hc:hover{transform:translateY(-4px);border-color:var(--border-stronger);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.hc:active{transform:scale(.99)}
.hc:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
.hi{height:214px;display:flex;align-items:center;justify-content:center;padding:12px;border-bottom:.5px solid var(--border);background:linear-gradient(180deg,var(--tint),var(--surface-2))}
.hi>svg{width:100%;height:100%}
.hi .tl3{display:flex;flex-direction:column;width:min(70%,270px)}
.hi .tl3 svg{display:block;width:100%;height:auto}
.c-cal{--tint:var(--bg-aqua)}.c-hand{--tint:var(--bg-violet)}.c-att{--tint:var(--bg-accent)}.c-tool{--tint:var(--bg-orange)}.c-cand{--tint:var(--bg-violet)}.c-act{--tint:var(--bg-warn)}.c-acc{--tint:var(--bg-ok)}
.hb{padding:14px 16px 16px}
.hb .t{font-size:20px;font-weight:500;margin:0 0 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{font-size:13px;font-weight:500;padding:4px 14px;border-radius:99px;background:var(--bg-accent);color:var(--text-accent)}
.hb .s{font-size:14px;color:var(--text-2);margin:0}
.bd{position:absolute;top:12px;right:12px;font-size:12px;font-weight:500;padding:3px 12px;border-radius:99px;z-index:1}
.ft{font-size:12px;color:var(--text-2);text-align:center;margin:16px 0 0}
@media(prefers-color-scheme:dark){.c-hand .hi,.c-att .hi,.c-tool .hi{background:linear-gradient(180deg,#E9EDEF,#DDE3E6)}}
.hi .tl3{margin-left:7%;margin-right:auto}
@media(max-width:900px){.hg>.hc:last-child:nth-child(2n+1){grid-column:1/-1}}
@media(min-width:901px){.hg>.hc:last-child:nth-child(3n+1){grid-column:1/-1;flex-direction:row}.hg>.hc:last-child:nth-child(3n+1) .hi{width:40%;height:auto;min-height:210px;border-bottom:0;border-right:.5px solid var(--border)}.hg>.hc:last-child:nth-child(3n+1) .hb{flex:1;display:flex;flex-direction:column;justify-content:center}}
@media(min-width:1100px){.hi{height:250px}.hb{padding:18px 20px 20px}.hb .t{font-size:22px}.hb .s{font-size:15px}.hg{gap:20px}}
</style>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">

<div class="hero">
  <div class="hu"><span class="who" id="who"></span><button id="inst">Install app</button><button id="out">Log out</button></div>
  <div class="lgo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div>
  <h1 id="hi">Welcome</h1>
  <p>ALEXEA Course Manager · Saturday 7 November 2026</p>
</div>
<div class="ip" id="ip"></div>
<div class="hg" id="hg"></div>
<p class="ft">Tap a card to open that page. Use the logo or Home in the top bar to come back.</p>
</div>
<script src="tool-drawings.js"></script>
<script src="station-sprite.js"></script>
<script src="install.js"></script>
<script>
var head=true;
/* SAMPLE summaries. In the real app these come from the API. */
var S={cal:'Next: Basic Laparoscopic Surgery · tomorrow',hands:'Day 1 tomorrow · 12 dry stations · 24 candidates',att:'5 of 8 on site · 1 late',tools:'21 units · 4 in use',cand:'24 candidates added',pend:2,rep:3,rev:2};
function $(i){return document.getElementById(i)}
var F='font-family="system-ui,sans-serif"';
function pill(x,y,w,t,bg,fg){return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="18" rx="9" fill="'+bg+'"/><text x="'+(x+w/2)+'" y="'+(y+13)+'" fill="'+fg+'" font-size="11" text-anchor="middle" '+F+'>'+t+'</text>'}
function calArt(){
  var col={3:'#E98AB5',4:'#E98AB5',5:'#E98AB5',8:'#EF9F7B',9:'#EF9F7B',10:'#EF9F7B',11:'#EF9F7B',15:'#E4577F',16:'#E4577F',17:'#E4577F',18:'#E4577F',22:'#EF9F7B',23:'#EF9F7B',24:'#EF9F7B',25:'#EF9F7B'},wd=['S','M','T','W','T','F','S'];
  var s='<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="rotate(-5 150 100)"><rect x="54" y="14" width="214" height="176" rx="12" fill="#EAF5F7" stroke="#B7D9DE"/></g><rect x="38" y="8" width="224" height="188" rx="12" fill="#fff" stroke="#C9CDCC"/><path d="M38 20a12 12 0 0 1 12-12h200a12 12 0 0 1 12 12v20H38z" fill="#1B8FA0"/><text x="250" y="30" fill="#fff" font-size="11" text-anchor="end" letter-spacing="1.5" '+F+'>NOVEMBER 2026</text>';
  wd.forEach(function(d,i){s+='<text x="'+(61+i*30.5)+'" y="55" fill="#8A8F8E" font-size="9" text-anchor="middle" '+F+'>'+d+'</text>'});
  for(var d=1;d<=30;d++){var c=(d-1)%7,r=Math.floor((d-1)/7),x=48+c*30.5,y=62+r*25,f=col[d],tx=f=='#E4577F'?'#fff':'#2A2A28';
    s+=(f?'<rect x="'+x+'" y="'+y+'" width="26" height="21" rx="6" fill="'+f+'"/>':'')+(d==7?'<rect x="'+x+'" y="'+y+'" width="26" height="21" rx="6" fill="none" stroke="#141413" stroke-width="1.6"/>':'')+'<text x="'+(x+13)+'" y="'+(y+14)+'" fill="'+(f?tx:'#555')+'" font-size="10" text-anchor="middle" '+F+'>'+d+'</text>'}
  return s+'</svg>'}
function handsArt(){
  return '<svg viewBox="0 0 660 216" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><use href="#d" x="0" y="14" width="220" height="200"/><use href="#w" x="220" y="14" width="220" height="200"/><use href="#a" x="440" y="14" width="220" height="200"/>'+pill(80,0,60,'Dry','#D7F0EA','#0B6B5B')+pill(300,0,60,'Wet','#FBE0CF','#8A3F12')+pill(520,0,60,'Animal','#E5E1F8','#4B3FA6')+'</svg>'}
function avatar(x,y,t,bg,fg,ok){return '<circle cx="'+x+'" cy="'+y+'" r="15" fill="'+bg+'" stroke="#fff" stroke-width="2.5"/><text x="'+x+'" y="'+(y+5)+'" fill="'+fg+'" font-size="13" font-weight="600" text-anchor="middle" '+F+'>'+t+'</text><circle cx="'+(x+11)+'" cy="'+(y+11)+'" r="6" fill="'+ok+'" stroke="#fff" stroke-width="1.5"/>'}
function attArt(){
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="10" y="8" width="280" height="90" rx="14" fill="#fff" stroke="#C9CDCC"/><text x="24" y="30" fill="#141413" font-size="13" font-weight="600" '+F+'>Upper team</text>'+pill(100,17,40,'Dry','#D7F0EA','#0B6B5B')+avatar(38,66,'A','#DCE9F8','#1F5FA6','#2F9E44')+avatar(72,66,'H','#F7DCE8','#8E2F5A','#2F9E44')+avatar(106,66,'N','#FBEBC4','#7A5600','#EF9F27')+'<use href="#d" x="196" y="14" width="86" height="78"/>'
   +'<rect x="10" y="106" width="280" height="90" rx="14" fill="#fff" stroke="#C9CDCC"/><text x="24" y="128" fill="#141413" font-size="13" font-weight="600" '+F+'>Lower team</text>'+pill(100,115,40,'Wet','#FBE0CF','#8A3F12')+avatar(38,164,'O','#E5E1F8','#4B3FA6','#2F9E44')+avatar(72,164,'Y','#DDEFD0','#2F6B14','#2F9E44')+'<use href="#w" x="196" y="112" width="86" height="78"/></svg>'}
function toolsArt(){return '<div class="tl3">'+toolSvg('grasper')+toolSvg('l0')+toolSvg('l30')+'</div>'}
function candArt(){
  function row(y,tag,name,chip,bg,fg,g,dash){return '<rect x="24" y="'+(y-12)+'" width="24" height="17" rx="4" fill="#F1EFE8" stroke="#C9CDCC"/><text x="36" y="'+(y+1)+'" fill="#5E5D59" font-size="10" text-anchor="middle" '+F+'>'+tag+'</text><text x="56" y="'+(y+2)+'" fill="#141413" font-size="13" '+F+'>'+name+'</text><rect x="168" y="'+(y-11)+'" width="84" height="20" rx="10" fill="'+bg+'"/><text x="210" y="'+(y+3)+'" fill="'+fg+'" font-size="11" text-anchor="middle" '+F+'>'+chip+'</text><circle cx="272" cy="'+(y-1)+'" r="7" fill="'+g+'"'+(dash?' stroke="#D9A93A" stroke-dasharray="2 2"':'')+'/>'}
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="10" y="8" width="280" height="188" rx="14" fill="#fff" stroke="#C9CDCC"/><text x="24" y="30" fill="#8A8F8E" font-size="10" letter-spacing="1" '+F+'>NAME</text><text x="176" y="30" fill="#8A8F8E" font-size="10" letter-spacing="1" '+F+'>COUNTRY</text><path d="M18 38H282" stroke="#E4E2DA"/>'
   +row(62,'ع','سارة محمود','Sudan ✓','#DDEFD0','#2F6B14','#F7DCE8')+row(100,'EN','Ahmed Hassan','Egypt ✓','#DDEFD0','#2F6B14','#DCE9F8')+row(138,'EN','Omar Khaled','Same as…?','#FBEBC4','#7A5600','#DCE9F8')+row(176,'ع','نور سالم','Libya ✓','#DDEFD0','#2F6B14','#FBEBC4',1)+'</svg>'}
function actArt(){
  function ev(y,c,bg,sym,w1,w2,t){return '<circle cx="40" cy="'+y+'" r="15" fill="'+bg+'" stroke="'+c+'" stroke-width="2"/><text x="40" y="'+(y+5)+'" fill="'+c+'" font-size="14" font-weight="600" text-anchor="middle" '+F+'>'+sym+'</text><rect x="68" y="'+(y-14)+'" width="'+w1+'" height="10" rx="5" fill="#C9CDCC"/><rect x="68" y="'+(y+4)+'" width="'+w2+'" height="8" rx="4" fill="#E4E2DA"/><text x="276" y="'+(y-5)+'" fill="#8A8F8E" font-size="10" text-anchor="end" '+F+'>'+t+'</text>'}
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="10" y="8" width="280" height="188" rx="14" fill="#fff" stroke="#C9CDCC"/><path d="M40 30V170" stroke="#E4E2DA" stroke-width="3"/>'+ev(56,'#2F6B14','#DDEFD0','✓',130,90,'10:42')+ev(110,'#9B2C20','#F8D9D5','!',150,110,'10:15')+ev(164,'#1F5FA6','#DCE9F8','⇄',120,80,'09:05')+'<rect x="66" y="14" width="58" height="16" rx="8" fill="#F8D9D5"/><text x="95" y="26" fill="#9B2C20" font-size="10" font-weight="600" text-anchor="middle" '+F+'>3 repair</text></svg>'}
function accArt(){
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M70 22L116 38V82C116 112 96 132 70 142C44 132 24 112 24 82V38Z" fill="#DCE9F8" stroke="#0A5CA8" stroke-width="3"/><path d="M50 82l14 14 28-30" fill="none" stroke="#0A5CA8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="136" y="30" width="148" height="64" rx="12" fill="#fff" stroke="#C9CDCC"/><circle cx="162" cy="62" r="15" fill="#FBEBC4"/><text x="162" y="67" fill="#7A5600" font-size="13" font-weight="600" text-anchor="middle" '+F+'>K</text><text x="186" y="58" fill="#141413" font-size="12" font-weight="600" '+F+'>Dr. Karim</text><rect x="186" y="66" width="44" height="18" rx="9" fill="#DDEFD0"/><text x="208" y="79" fill="#2F6B14" font-size="10" text-anchor="middle" '+F+'>Approve</text><rect x="136" y="106" width="148" height="64" rx="12" fill="#fff" stroke="#C9CDCC"/><circle cx="162" cy="138" r="15" fill="#E5E1F8"/><text x="162" y="143" fill="#4B3FA6" font-size="13" font-weight="600" text-anchor="middle" '+F+'>M</text><text x="186" y="134" fill="#141413" font-size="12" font-weight="600" '+F+'>Dr. Mona</text><rect x="186" y="142" width="44" height="18" rx="9" fill="#DDEFD0"/><text x="208" y="155" fill="#2F6B14" font-size="10" text-anchor="middle" '+F+'>Approve</text></svg>'}
function myArt(){
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><circle cx="150" cy="86" r="52" fill="#DCE9F8" stroke="#fff" stroke-width="5"/><text x="150" y="104" fill="#1F5FA6" font-size="52" font-weight="600" text-anchor="middle" '+F+'>S</text><rect x="104" y="150" width="92" height="30" rx="15" fill="#fff" stroke="#C9CDCC"/><text x="150" y="170" fill="#5E5D59" font-size="12" text-anchor="middle" '+F+'>Dr. Sara</text><g transform="translate(196 112)"><rect width="34" height="26" rx="6" fill="#0A5CA8"/><path d="M8 0V-8a9 9 0 0 1 18 0V0" fill="none" stroke="#0A5CA8" stroke-width="4"/><circle cx="17" cy="13" r="3.5" fill="#fff"/></g></svg>'}
function cards(){
  var c=[
   {h:'calendar.html',t:'Calendar',s:S.cal,a:calArt(),k:'c-cal'},
   {h:'hands-on.html',t:'Hands-on',s:S.hands,a:handsArt(),k:'c-hand'},
   {h:'attendance.html',t:'Attendance',s:S.att,a:attArt(),k:'c-att'},
   {h:'tools.html',t:'Tools',s:S.tools,a:toolsArt(),k:'c-tool',b:[S.rep+' need repair','s-bad']},
   {h:'import.html',t:'Candidates',s:S.cand,a:candArt(),k:'c-cand',b:[S.rev+' to review','s-warn']}];
  if(head)c.push({h:'activity.html',t:'Team activity',s:'What the team did today · 14 actions',a:actArt(),k:'c-act'},{h:'accounts.html',t:'Approvals',s:'Accounts waiting for a head to approve',a:accArt(),k:'c-acc',b:[S.pend+' waiting','s-warn']});
  else c.push({h:'accounts.html',t:'My account',s:'Dr. Sara · member · change password',a:myArt(),k:'c-acc'});
  $('hg').innerHTML=c.map(function(x){
    return '<a class="hc '+x.k+'" href="'+x.h+'"><div class="hi">'+x.a+'</div>'+(x.b?'<span class="bd pl '+x.b[1]+'">'+x.b[0]+'</span>':'')+'<div class="hb"><p class="t">'+x.t+'<span class="go">Open ›</span></p><p class="s">'+x.s+'</p></div></a>'}).join('');
  /* view-as removed */
  $('who').textContent=head?'Dr. Ahmed · head':'Dr. Sara · member';
  $('hi').textContent='Welcome, '+(head?'Dr. Ahmed':'Dr. Sara')}
$('out').onclick=function(){session.logout()};
ALX_install($('inst'),$('ip'));
cards();
</script>
</body>
</html>

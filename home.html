<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · ALEXEA Course Manager</title>
<link rel="stylesheet" href="shared.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#003C7E">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
.hero{min-height:150px}
.hero .lgo{width:64px;height:64px;border-radius:14px}
.hero h1{font-size:24px}
.hu{position:absolute;top:14px;right:14px;z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:none!important}
.hu .who{font-size:13px;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:99px}
.ip{background:var(--bg-accent);color:var(--text-accent);border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:14px;display:none}
.hg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media(max-width:900px){.hg{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.hg{grid-template-columns:minmax(0,1fr)}.hu{position:static;margin-bottom:8px;justify-content:flex-start}}
.hc{position:relative;display:flex;flex-direction:column;background:var(--surface-1);border:.5px solid var(--border);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .14s,box-shadow .14s,border-color .14s}
.hc:hover{transform:translateY(-4px);border-color:var(--border-stronger);box-shadow:0 10px 24px rgba(0,0,0,.14)}
.hc:active{transform:scale(.99)}
.hc:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px}
.hi{height:214px;display:flex;align-items:center;justify-content:center;padding:12px;border-bottom:.5px solid var(--border);background:linear-gradient(180deg,var(--tint),var(--surface-2))}
.hi>svg{width:100%;height:100%}
.hi .tl3{display:flex;flex-direction:column;width:min(70%,270px)}
.hi .tl3 svg{display:block;width:100%;height:auto}
.c-cal{--tint:var(--bg-aqua)}.c-hand{--tint:var(--bg-violet)}.c-att{--tint:var(--bg-accent)}.c-tool{--tint:var(--bg-orange)}.c-cand{--tint:var(--bg-violet)}.c-act{--tint:var(--bg-warn)}.c-acc{--tint:var(--bg-ok)}
.hb{padding:14px 16px 16px}
.hb .t{font-size:20px;font-weight:500;margin:0 0 3px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.go{font-size:13px;font-weight:500;padding:4px 14px;border-radius:99px;background:var(--bg-accent);color:var(--text-accent)}
.hb .s{font-size:14px;color:var(--text-2);margin:0}
.bd{position:absolute;top:12px;right:12px;font-size:12px;font-weight:500;padding:3px 12px;border-radius:99px;z-index:1}
.ft{font-size:12px;color:var(--text-2);text-align:center;margin:16px 0 0}
@media(prefers-color-scheme:dark){.c-hand .hi,.c-att .hi,.c-tool .hi{background:linear-gradient(180deg,#E9EDEF,#DDE3E6)}}
.hi .tl3{margin-left:7%;margin-right:auto}
@media(max-width:900px){.hg>.hc:last-child:nth-child(2n+1){grid-column:1/-1}}
@media(min-width:901px){.hg>.hc:last-child:nth-child(3n+1){grid-column:1/-1;flex-direction:row}.hg>.hc:last-child:nth-child(3n+1) .hi{width:40%;height:auto;min-height:210px;border-bottom:0;border-right:.5px solid var(--border)}.hg>.hc:last-child:nth-child(3n+1) .hb{flex:1;display:flex;flex-direction:column;justify-content:center}}
@media(min-width:1100px){.hi{height:250px}.hb{padding:18px 20px 20px}.hb .t{font-size:22px}.hb .s{font-size:15px}.hg{gap:20px}}
</style>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/session.js"></script></head>
<body>
<div class="wrap">

<div class="hero">
  <div class="hu"><span class="who" id="who"></span><button id="inst">Install app</button><button id="out">Log out</button></div>
  <div class="lgo"><img src="assets/alexea-logo.jpg" alt="ALEXEA logo"></div>
  <h1 id="hi">Welcome</h1>
  <p id="dateLine">ALEXEA Course Manager</p>
</div>
<div class="ip" id="ip"></div>
<div class="hg" id="hg"></div>
<p class="ft">Tap a card to open that page. Use the logo or Home in the top bar to come back.</p>
</div>
<script src="tool-drawings.js"></script>
<script src="station-sprite.js"></script>
<script src="install.js"></script>
<script>
var head = session.isHead();
var S = { cal: 'No course scheduled', hands: 'Station planning', att: 'Team check-in', tools: 'No tools yet', cand: 'Import candidates', act: 'What the team did', pend: 0, rep: 0 };
var DATA = { courses: [], day: null, cands: [], att: [], people: {}, acts: [], pendUsers: [], country: {} };

function $(i) { return document.getElementById(i); }
function esc(x) { var e = document.createElement('div'); e.textContent = x == null ? '' : x; return e.innerHTML; }
function fd(k) { var d = new Date(k + 'T00:00:00Z'); return ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'][d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getUTCMonth()] + ' ' + d.getUTCFullYear(); }
var TYPE = { d12: '12 dry stations', dw: '6 dry + 6 wet', da: '6 dry + 6 animal', sh: 'Shift day', none: 'No hands-on' };
var DEPCOL = { gen: '#FBE3D0', gyn: '#F7DCE8', endo: '#E5E1F8', brs: '#FAD4E0', ped: '#F6E8C3', uro: '#EBD9C5' };
var DEPTX = { gen: '#8A3F12', gyn: '#8E2F5A', endo: '#4B3FA6', brs: '#A0123F', ped: '#7A5600', uro: '#5E3A14' };
var MONTHS = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
function depOf(c) { return DEPCOL[c.dept] ? c.dept : 'gen'; }
function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

var F = 'font-family="system-ui,sans-serif"';
function pill(x, y, w, t, bg, fg) { return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="18" rx="9" fill="' + bg + '"/><text x="' + (x + w / 2) + '" y="' + (y + 13) + '" fill="' + fg + '" font-size="11" text-anchor="middle" ' + F + '>' + t + '</text>'; }
function emptyText(y, t) { return '<text x="150" y="' + y + '" fill="#8A8F8E" font-size="12" text-anchor="middle" ' + F + '>' + t + '</text>'; }

function calArt() {
  var now = new Date(), y = now.getFullYear(), m = now.getMonth();
  var startDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
  var days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  var col = {}, today = now.getDate();
  DATA.courses.forEach(function (c) {
    var s = new Date(c.startDate + 'T00:00:00Z'), e = new Date(c.endDate + 'T00:00:00Z');
    for (var d = new Date(s); d <= e; d.setUTCDate(d.getUTCDate() + 1)) {
      if (d.getUTCFullYear() === y && d.getUTCMonth() === m) col[d.getUTCDate()] = depOf(c);
    }
  });
  var wd = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
  var s = '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="rotate(-5 150 100)"><rect x="54" y="14" width="214" height="176" rx="12" fill="#EAF5F7" stroke="#B7D9DE"/></g><rect x="38" y="8" width="224" height="188" rx="12" fill="#fff" stroke="#C9CDCC"/><path d="M38 20a12 12 0 0 1 12-12h200a12 12 0 0 1 12 12v20H38z" fill="#1B8FA0"/><text x="250" y="30" fill="#fff" font-size="11" text-anchor="end" letter-spacing="1.5" ' + F + '>' + MONTHS[m] + ' ' + y + '</text>';
  wd.forEach(function (d, i) { s += '<text x="' + (61 + i * 30.5) + '" y="55" fill="#8A8F8E" font-size="9" text-anchor="middle" ' + F + '>' + d + '</text>'; });
  for (var d = 1; d <= days; d++) {
    var i2 = startDow + d - 1;
    var c = i2 % 7, r = Math.floor(i2 / 7), x = 48 + c * 30.5, yy = 62 + r * 25, k = col[d], tx = k === 'gyn' || k === 'brs' || k === 'endo' ? '#fff' : '#2A2A28';
    s += (k ? '<rect x="' + x + '" y="' + yy + '" width="26" height="21" rx="6" fill="' + DEPCOL[k] + '"/>' : '') + (d === today ? '<rect x="' + x + '" y="' + yy + '" width="26" height="21" rx="6" fill="none" stroke="#141413" stroke-width="1.6"/>' : '') + '<text x="' + (x + 13) + '" y="' + (yy + 14) + '" fill="' + (k ? tx : '#555') + '" font-size="10" text-anchor="middle" ' + F + '>' + d + '</text>';
  }
  return s + '</svg>';
}
function handsArt() {
  return '<svg viewBox="0 0 660 216" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><use href="#d" x="0" y="14" width="220" height="200"/><use href="#w" x="220" y="14" width="220" height="200"/><use href="#a" x="440" y="14" width="220" height="200"/>' + pill(80, 0, 60, 'Dry', '#D7F0EA', '#0B6B5B') + pill(300, 0, 60, 'Wet', '#FBE0CF', '#8A3F12') + pill(520, 0, 60, 'Animal', '#E5E1F8', '#4B3FA6') + '</svg>';
}
function avatar(x, y, t, bg, fg, ok) { return '<circle cx="' + x + '" cy="' + y + '" r="15" fill="' + bg + '" stroke="#fff" stroke-width="2.5"/><text x="' + x + '" y="' + (y + 5) + '" fill="' + fg + '" font-size="13" font-weight="600" text-anchor="middle" ' + F + '>' + t + '</text><circle cx="' + (x + 11) + '" cy="' + (y + 11) + '" r="6" fill="' + ok + '" stroke="#fff" stroke-width="1.5"/>'; }
function attArt() {
  var day = DATA.day || {};
  var team = day.team || {};
  var att = DATA.att || [];
  var type = TYPE[day.type || 'none'] || 'No hands-on';
  var tpill = type === 'Shift day' ? ['Wet', '#FBE0CF', '#8A3F12'] : type === '12 dry stations' ? ['Dry', '#D7F0EA', '#0B6B5B'] : type === 'No hands-on' ? ['Off', '#E4E2DA', '#5E5D59'] : ['Dry', '#D7F0EA', '#0B6B5B'];
  function people(letter, y) {
    var ids = Object.keys(team).filter(function (id) { return team[id] === letter; }).slice(0, 3);
    if (!ids.length) return null;
    return ids.map(function (id, i) {
      var name = (DATA.people[id] || {}).name || '';
      var a = att.filter(function (r) { return String(r.userId) === String(id); })[0];
      var ok = !a ? '#C9CDCC' : a.state === 'absent' ? '#9B2C20' : a.state === 'late' ? '#EF9F27' : '#2F9E44';
      var initial = (name.replace(/^Dr\.\s*/i, '').charAt(0) || '?').toUpperCase();
      return avatar(38 + i * 34, y, initial, i === 0 ? '#DCE9F8' : i === 1 ? '#F7DCE8' : '#DDEFD0', '#1F5FA6', ok);
    }).join('');
  }
  function panel(y, title, letter, sprite) {
    var ppl = people(letter, y + 58);
    return '<rect x="10" y="' + y + '" width="280" height="90" rx="14" fill="#fff" stroke="#C9CDCC"/>'
      + '<text x="24" y="' + (y + 22) + '" fill="#141413" font-size="13" font-weight="600" ' + F + '>' + title + '</text>'
      + pill(100, y + 9, 40, tpill[0], tpill[1], tpill[2])
      + (ppl || emptyText(y + 60, 'Not assigned yet'))
      + '<use href="#' + sprite + '" x="196" y="' + (y + 6) + '" width="86" height="78"/>';
  }
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + panel(8, 'Upper team', 'U', 'd') + panel(106, 'Lower team', 'L', 'w') + '</svg>';
}
function toolsArt() { return '<div class="tl3">' + toolSvg('grasper') + toolSvg('l0') + toolSvg('l30') + '</div>'; }
function candArt() {
  function row(y, tag, name, chip, bg, fg, g, dash) { return '<rect x="24" y="' + (y - 12) + '" width="24" height="17" rx="4" fill="#F1EFE8" stroke="#C9CDCC"/><text x="36" y="' + (y + 1) + '" fill="#5E5D59" font-size="10" text-anchor="middle" ' + F + '>' + tag + '</text><text x="56" y="' + (y + 2) + '" fill="#141413" font-size="12" ' + F + '>' + esc(clip(name, 18)) + '</text><rect x="168" y="' + (y - 11) + '" width="84" height="20" rx="10" fill="' + bg + '"/><text x="210" y="' + (y + 3) + '" fill="' + fg + '" font-size="10" text-anchor="middle" ' + F + '>' + esc(clip(chip, 13)) + '</text><circle cx="272" cy="' + (y - 1) + '" r="7" fill="' + g + '"' + (dash ? ' stroke="#D9A93A" stroke-dasharray="2 2"' : '') + '/>'; }
  var list = DATA.cands.slice(0, 4);
  var body = '';
  if (!list.length) body = emptyText(110, 'No candidates yet');
  list.forEach(function (c, i) {
    var ar = /[\u0600-\u06FF]/.test(c.nameAr || '') && !c.nameEn;
    var name = c.nameEn || c.nameAr || '';
    var country = DATA.country[c.countryId] || '';
    var chip = country ? country + ' ✓' : 'Added';
    var bg = country ? '#DDEFD0' : '#FBEBC4', fg = country ? '#2F6B14' : '#7A5600';
    var dot = c.gender === 'f' ? '#F7DCE8' : c.gender === 'm' ? '#DCE9F8' : '#FBEBC4';
    body += row(62 + i * 38, ar ? 'ع' : 'EN', name, chip, bg, fg, dot, c.gender === 'u');
  });
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="10" y="8" width="280" height="188" rx="14" fill="#fff" stroke="#C9CDCC"/><text x="24" y="30" fill="#8A8F8E" font-size="10" letter-spacing="1" ' + F + '>NAME</text><text x="176" y="30" fill="#8A8F8E" font-size="10" letter-spacing="1" ' + F + '>COUNTRY</text><path d="M18 38H282" stroke="#E4E2DA"/>' + body + '</svg>';
}
function actArt() {
  var IC = { checkin: '✓', assign: '⇄', tool: '⚙', repair: '!', cand: '☰', acct: '☺', cal: '▦' };
  var COL = { checkin: ['#2F6B14', '#DDEFD0'], assign: ['#1F5FA6', '#DCE9F8'], tool: ['#8A3F12', '#FBE0CF'], repair: ['#9B2C20', '#F8D9D5'], cand: ['#4B3FA6', '#E5E1F8'], acct: ['#7A5600', '#FBEBC4'], cal: ['#0B6B5B', '#D7F0EA'] };
  function ev(y, c, bg, sym, label, who, t) { return '<circle cx="40" cy="' + y + '" r="15" fill="' + bg + '" stroke="' + c + '" stroke-width="2"/><text x="40" y="' + (y + 5) + '" fill="' + c + '" font-size="14" font-weight="600" text-anchor="middle" ' + F + '>' + sym + '</text><text x="66" y="' + (y - 2) + '" fill="#141413" font-size="11" ' + F + '>' + esc(clip(who, 20)) + '</text><text x="66" y="' + (y + 12) + '" fill="#8A8F8E" font-size="10" ' + F + '>' + esc(clip(label, 22)) + '</text><text x="276" y="' + (y - 2) + '" fill="#8A8F8E" font-size="10" text-anchor="end" ' + F + '>' + t + '</text>'; }
  var list = DATA.acts.slice(0, 3), body = '';
  if (!list.length) body = emptyText(110, 'Nothing recorded yet');
  else body += '<path d="M40 30V170" stroke="#E4E2DA" stroke-width="3"/>';
  list.forEach(function (e, i) {
    var k = e.kind === 'repair' ? 'repair' : (COL[e.kind] ? e.kind : 'tool');
    var c = COL[k];
    var label = String(e.text || '').replace(/<[^>]+>/g, '');
    body += ev(56 + i * 54, c[0], c[1], IC[k] || '•', label, e.by || '', e.time || '');
  });
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><rect x="10" y="8" width="280" height="188" rx="14" fill="#fff" stroke="#C9CDCC"/>' + body + '</svg>';
}
function accArt() {
  var shield = '<path d="M70 22L116 38V82C116 112 96 132 70 142C44 132 24 112 24 82V38Z" fill="#DCE9F8" stroke="#0A5CA8" stroke-width="3"/><path d="M50 82l14 14 28-30" fill="none" stroke="#0A5CA8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>';
  var list = DATA.pendUsers.slice(0, 2), body = '';
  if (!list.length) body = '<text x="196" y="86" fill="#8A8F8E" font-size="12" text-anchor="middle" ' + F + '>No account</text><text x="196" y="104" fill="#8A8F8E" font-size="12" text-anchor="middle" ' + F + '>is waiting</text>';
  list.forEach(function (u, i) {
    var y = 30 + i * 76;
    var name = clip(u.name || u.username, 14);
    var init = (String(u.name || u.username || '?').replace(/^Dr\.\s*/i, '').charAt(0) || '?').toUpperCase();
    body += '<rect x="136" y="' + y + '" width="148" height="64" rx="12" fill="#fff" stroke="#C9CDCC"/><circle cx="162" cy="' + (y + 32) + '" r="15" fill="' + (i ? '#E5E1F8' : '#FBEBC4') + '"/><text x="162" y="' + (y + 37) + '" fill="' + (i ? '#4B3FA6' : '#7A5600') + '" font-size="13" font-weight="600" text-anchor="middle" ' + F + '>' + init + '</text><text x="186" y="' + (y + 28) + '" fill="#141413" font-size="12" font-weight="600" ' + F + '>' + esc(name) + '</text><rect x="186" y="' + (y + 36) + '" width="44" height="18" rx="9" fill="#DDEFD0"/><text x="208" y="' + (y + 49) + '" fill="#2F6B14" font-size="10" text-anchor="middle" ' + F + '>Approve</text>';
  });
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true">' + shield + body + '</svg>';
}
function myArt() {
  var u = session.user() || {};
  var initial = (String(u.name || '?').replace(/^Dr\.\s*/i, '').charAt(0) || '?').toUpperCase();
  return '<svg viewBox="0 0 300 204" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><circle cx="150" cy="86" r="52" fill="#DCE9F8" stroke="#fff" stroke-width="5"/><text x="150" y="104" fill="#1F5FA6" font-size="52" font-weight="600" text-anchor="middle" ' + F + '>' + initial + '</text><rect x="104" y="150" width="92" height="30" rx="15" fill="#fff" stroke="#C9CDCC"/><text x="150" y="170" fill="#5E5D59" font-size="12" text-anchor="middle" ' + F + '>Account</text><g transform="translate(196 112)"><rect width="34" height="26" rx="6" fill="#0A5CA8"/><path d="M8 0V-8a9 9 0 0 1 18 0V0" fill="none" stroke="#0A5CA8" stroke-width="4"/><circle cx="17" cy="13" r="3.5" fill="#fff"/></g></svg>';
}

function cards() {
  var c = [
    { h: '/calendar', t: 'Calendar', s: S.cal, a: calArt(), k: 'c-cal' },
    { h: '/hands-on', t: 'Hands-on', s: S.hands, a: handsArt(), k: 'c-hand' },
    { h: '/attendance', t: 'Attendance', s: S.att, a: attArt(), k: 'c-att' },
    { h: '/tools', t: 'Tools', s: S.tools, a: toolsArt(), k: 'c-tool', b: S.rep ? [S.rep + ' need repair', 's-bad'] : null },
    { h: '/candidates', t: 'Candidates', s: S.cand, a: candArt(), k: 'c-cand' }
  ];
  if (head) c.push({ h: '/activity', t: 'Team activity', s: S.act, a: actArt(), k: 'c-act' }, { h: '/account', t: 'Approvals', s: S.pend ? 'Accounts waiting for a head to approve' : 'No account is waiting', a: accArt(), k: 'c-acc', b: S.pend ? [S.pend + ' waiting', 's-warn'] : null });
  else c.push({ h: '/account', t: 'My account', s: 'Change your password and install the app', a: myArt(), k: 'c-acc' });
  $('hg').innerHTML = c.map(function (x) {
    return '<a class="hc ' + x.k + '" href="' + x.h + '"><div class="hi">' + x.a + '</div>' + (x.b ? '<span class="bd pl ' + x.b[1] + '">' + x.b[0] + '</span>' : '') + '<div class="hb"><p class="t">' + x.t + '<span class="go">Open ›</span></p><p class="s" dir="auto">' + esc(x.s) + '</p></div></a>';
  }).join('');
}

function setWho() {
  var u = session.user();
  if (!u) return;
  $('who').textContent = u.name + ' · ' + u.role;
  $('hi').textContent = 'Welcome, ' + u.name;
  $('dateLine').textContent = 'ALEXEA Course Manager · ' + fd(new Date().toISOString().slice(0, 10));
}

$('out').onclick = function () { session.logout(); };
ALX_install($('inst'), $('ip'));

(async function () {
  if (!session.requireAuth()) return;
  setWho();
  cards();
  var today = new Date().toISOString().slice(0, 10);
  var job = [];

  job.push(api('/api/courses').then(function (d) {
    DATA.courses = d.courses || [];
    var cs = DATA.courses.filter(function (c) { return c.endDate >= today; }).sort(function (a, b) { return a.startDate < b.startDate ? -1 : 1; });
    var c = cs[0];
    if (!c) { S.cal = 'No course scheduled'; return; }
    var days = Math.round((new Date(c.startDate + 'T00:00:00Z') - new Date(today + 'T00:00:00Z')) / 864e5);
    S.cal = 'Next: ' + c.name + (days > 0 ? ' · in ' + days + ' day' + (days > 1 ? 's' : '') : ' · running now');
  }).catch(function () {}));

  job.push(api('/api/users').then(function (d) {
    (d.users || []).forEach(function (u) { DATA.people[u.id] = u; });
  }).catch(function () {}));

  job.push(api('/api/places?type=country').then(function (d) {
    (d.places || []).forEach(function (p) { DATA.country[String(p._id)] = p.canonicalEn || p.canonicalAr || ''; });
  }).catch(function () {}));

  job.push(api('/api/courses/active-day').then(function (d) {
    if (!d || !d.day) { S.hands = 'No course day yet'; S.att = 'No course today'; return; }
    var day = d.day;
    DATA.day = day;
    var type = day.type || 'none';
    var names = day.candidates || [];
    S.hands = 'Day ' + (day.index || 1) + ' · ' + (TYPE[type] || 'No hands-on') + (names.length ? ' · ' + names.length + ' candidates' : '');
    return Promise.all([
      api('/api/attendance?courseDayId=' + day._id).then(function (a) {
        DATA.att = a.attendance || [];
        var present = DATA.att.filter(function (r) { return r.state === 'present' || r.state === 'late'; }).length;
        var late = DATA.att.filter(function (r) { return r.state === 'late'; }).length;
        S.att = present + ' on site' + (late ? ' · ' + late + ' late' : '');
      }).catch(function () {}),
      api('/api/candidates?courseId=' + day.courseId).then(function (c) {
        DATA.cands = c.candidates || [];
        S.cand = DATA.cands.length ? DATA.cands.length + ' candidate' + (DATA.cands.length === 1 ? '' : 's') + ' added' : 'No candidates yet';
      }).catch(function () {})
    ]);
  }).catch(function () {}));

  job.push(api('/api/tools').then(function (d) {
    var t = d.tools || [];
    var inuse = t.filter(function (x) { return x.status === 'inuse'; }).length;
    S.tools = t.length ? t.length + ' unit' + (t.length === 1 ? '' : 's') + ' · ' + inuse + ' in use' : 'No tools yet';
  }).catch(function () {}));

  job.push(api('/api/tools/repair-count').then(function (d) { S.rep = d.count || 0; }).catch(function () {}));

  if (head) {
    job.push(api('/api/users/team').then(function (d) {
      var us = d.users || [];
      DATA.pendUsers = us.filter(function (x) { return x.status === 'pending'; });
      S.pend = DATA.pendUsers.length;
    }).catch(function () {}));
    job.push(api('/api/activity').then(function (d) {
      DATA.acts = d.entries || [];
      S.act = DATA.acts.length ? DATA.acts.length + ' action' + (DATA.acts.length === 1 ? '' : 's') + ' recorded' : 'Nothing recorded yet';
    }).catch(function () {}));
  }

  await Promise.all(job);
  cards();
})();
</script>
</body>
</html>
